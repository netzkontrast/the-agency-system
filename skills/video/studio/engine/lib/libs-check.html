<!doctype html><html><head><meta charset="utf-8"><title>libs check</title>
<script type="importmap">{"imports":{"three":"../../node_modules/three/build/three.module.js"}}</script>
</head><body><pre id="o"></pre>
<script src="../../node_modules/d3/dist/d3.min.js"></script>
<script src="../../node_modules/lottie-web/build/player/lottie.min.js"></script>
<script src="../../node_modules/alea/alea.js"></script>
<script type="module">
// tools/libs-check.mjs opens this page (served from the studio root) and reads window.LIBS.
const map = await (await fetch('importmap.json')).json();
const res = {};
for (const [name, path] of Object.entries(map.imports)) {
  if (name.endsWith('/')) continue;
  try { const m = await import(path.replace('./node_modules', '../../node_modules')); res[name] = Object.keys(m).length ? 'ok' : 'empty'; }
  catch (e) { res[name] = 'FAIL ' + e.message; }
}
res.d3 = typeof d3 === 'object' && d3.Delaunay ? 'ok' : 'FAIL'; res.lottie = typeof lottie === 'object' ? 'ok' : 'FAIL'; res.alea = typeof Alea === 'function' ? 'ok' : 'FAIL';
window.LIBS = res; document.getElementById('o').textContent = JSON.stringify(res, null, 1);
</script></body></html>
