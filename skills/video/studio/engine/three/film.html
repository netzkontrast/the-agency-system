<html>
<head>
<meta charset="utf-8">
<title>film · three medium</title>
<style>html,body{margin:0;background:#111}canvas{display:block;width:100vw;height:auto;max-height:100vh;object-fit:contain}</style>
<!-- three.js and its addons from the studio's node_modules (symlinked into the project) -->
<script type="importmap">{"imports": {"three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/", "postprocessing": "./node_modules/postprocessing/build/index.js", "simplex-noise": "./node_modules/simplex-noise/dist/esm/simplex-noise.js", "culori": "./node_modules/culori/bundled/culori.min.mjs", "roughjs": "./node_modules/roughjs/bundled/rough.esm.js", "perfect-freehand": "./node_modules/perfect-freehand/dist/esm/index.mjs", "animejs": "./node_modules/animejs/dist/bundles/anime.esm.min.js", "pixi.js": "./node_modules/pixi.js/dist/pixi.min.mjs", "opentype.js": "./node_modules/opentype.js/dist/opentype.mjs"}}</script>
<!-- classic-script libraries (globals): d3, lottie, Alea — uncomment what the film uses -->
<!-- <script src="node_modules/d3/dist/d3.min.js"></script> <script src="node_modules/lottie-web/build/player/lottie.min.js"></script> <script src="node_modules/alea/alea.js"></script> -->
<script src="config.js"></script>
<script src="songmap.js"></script>
<script src="engine/beat.js"></script>
</head>
<body><canvas id="c"></canvas>
<script type="module">
// Film contract (references/film-contract.md) for three.js: scenes/scene.js exports setup(ctx) → { scene, camera,
// passes?, update(t, ctx) }. update(t) sets EVERY animated value from t (no deltas, no clocks, no AnimationMixer.update:
// use mixer.setTime(t)); the composer renders with delta 0 and setFxTime() feeds t to the studio passes.
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { FX, setFxTime } from './engine/passes.js';
import * as film from './scenes/scene.js';

const Q = new URLSearchParams(location.search);
const W = Number(Q.get('w')) || 1920, H = Number(Q.get('h')) || 1080;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping;
// seeded randomness for scene building (mulberry32); never Math.random
const rng = (seed = 1) => () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const ctx = { THREE, renderer, W, H, FX, SONG: window.SONG, PROJECT: window.PROJECT || PROJECT, rng };
const built = await film.setup(ctx);
const composer = new EffectComposer(renderer);
composer.setPixelRatio(1); composer.setSize(W, H);
composer.addPass(new RenderPass(built.scene, built.camera));
for (const p of built.passes || []) composer.addPass(p);
composer.addPass(new OutputPass());

window.FILM_DURATION = PROJECT.duration; window.FILM_CANVAS = canvas;
if (built.step) window.FILM_STEP = built.step;           // stepped looks (boil on twos) declare their drawing rate
if (built.holds) window.HOLDS = built.holds;             // deliberate still stretches [[a, b], …] (the gate's dead-air check)
if (built.cuts) window.CUTS = built.cuts;                // deliberate hard cuts [t, …] (the gate's pop check)
// some three/addons passes (GlitchPass, film/noise) call Math.random: give them a stream seeded by the frame,
// so every frame is the same however often and in whatever order it is drawn
const seedFrame = (t) => { Math.random = rng(1 + Math.round(t * 1000)); };   // studio:seeded-random
window.renderFrame = async (t) => { seedFrame(t); await built.update(t, ctx); setFxTime(composer, t, W, H); composer.render(0); };
await document.fonts.ready;
window.READY = true;
if (!navigator.webdriver) { const s = performance.now(); const loop = (n) => { window.renderFrame(((n - s) / 1000) % window.FILM_DURATION); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
</script>
</body>
</html>
