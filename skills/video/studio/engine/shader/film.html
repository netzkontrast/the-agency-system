<body><canvas id="c"></canvas>
<script type="module">
// Film contract for the shader medium: scenes/film.js lists the passes (engine/shader/runtime.js explains them).
import { createFilm } from './engine/runtime.js';
import film from './scenes/film.js';
const Q = new URLSearchParams(location.search);
const W = Number(Q.get('w')) || 1920, H = Number(Q.get('h')) || 1080;
const canvas = document.getElementById('c'); canvas.width = W; canvas.height = H;
const f = await createFilm(canvas, film, { W, H, SONG: window.SONG });
window.FILM_DURATION = PROJECT.duration; window.FILM_CANVAS = canvas;
if (film.step) window.FILM_STEP = film.step;
window.renderFrame = (t) => f.renderFrame(t);
window.READY = true;
if (!navigator.webdriver) { const s = performance.now(); const loop = (n) => { f.renderFrame(((n - s) / 1000) % window.FILM_DURATION); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
</script>
