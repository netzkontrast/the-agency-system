<!doctype html><html><head><meta charset="utf-8"><title>recipe sampler · canvas medium</title>
<style>html,body{margin:0;background:#111}canvas{display:block;width:100vw;height:auto;max-height:100vh;object-fit:contain}</style>
<!-- libraries (engine/lib/importmap.json, references/libraries.md) -->
<script type="importmap">{"imports": {"three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/", "postprocessing": "./node_modules/postprocessing/build/index.js", "simplex-noise": "./node_modules/simplex-noise/dist/esm/simplex-noise.js", "culori": "./node_modules/culori/bundled/culori.min.mjs", "roughjs": "./node_modules/roughjs/bundled/rough.esm.js", "perfect-freehand": "./node_modules/perfect-freehand/dist/esm/index.mjs", "animejs": "./node_modules/animejs/dist/bundles/anime.esm.min.js", "pixi.js": "./node_modules/pixi.js/dist/pixi.min.mjs", "opentype.js": "./node_modules/opentype.js/dist/opentype.mjs"}}</script>
<!-- classic-script libraries (globals): d3 and Alea. NB: the template's comment names d3/dist/d3.min.js, which the installed d3 does not ship -->
<script src="node_modules/d3/dist/d3.js"></script>
<script src="node_modules/alea/alea.js"></script>
<!-- culori and opentype as classic (UMD) scripts: tools/gate.mjs serves .mjs as application/octet-stream, so the importmap
     entries culori.min.mjs / opentype.mjs fail to load under the gate (README problem 14); render.mjs serves them fine -->
<script src="node_modules/culori/bundled/culori.umd.js"></script>
<script src="node_modules/opentype.js/dist/opentype.js"></script>
<script src="config.js"></script>
<script src="songmap.js"></script>
<script src="engine/springs.js"></script>
<script src="engine/beat.js"></script>
</head>
<body><canvas id="c"></canvas><script type="module">
// Recipe sampler, canvas medium: ?recipe=<id> picks one of RECIPES (scenes/recipes.js). Film contract as usual:
// FILM_DURATION, renderFrame(t) a pure function of t, READY after fonts and the bake.
import { RECIPES, DEFAULT_RECIPE } from './scenes/recipes.js';
const Q = new URLSearchParams(location.search);
const W = Number(Q.get('w')) || (Q.has('portrait') ? 1080 : 1920), H = Number(Q.get('h')) || 1080;
const c = document.getElementById('c'); c.width = W; c.height = H; const g = c.getContext('2d');
window.FILM_DURATION = PROJECT.duration; window.FILM_CANVAS = c;
const id = Q.get('recipe') || DEFAULT_RECIPE, R = RECIPES[id];
if (!R) throw new Error(`unknown recipe "${id}" — one of ${Object.keys(RECIPES).join(', ')}`);
const state = await R.setup({ W, H, g, duration: PROJECT.duration, SONG: window.SONG });
if (R.step) window.FILM_STEP = R.step;
window.renderFrame = (t) => {
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.filter = 'none';
  R.draw(g, t, state);
};
await document.fonts.ready;
window.READY = true;
if (!navigator.webdriver) { const s = performance.now(); const loop = (n) => { window.renderFrame(((n - s) / 1000) % window.FILM_DURATION); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }   // studio:host-timing
</script></body></html>
