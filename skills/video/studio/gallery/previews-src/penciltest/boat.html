<canvas id="c" width="1280" height="720"></canvas>
<script>
'use strict';
const W=1280,H=720;
function mulberry32(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function noise1(seed){const r=mulberry32(seed);const v=[];for(let i=0;i<256;i++)v.push(r()*2-1);
  return t=>{const i=Math.floor(t),f=t-i,a=v[((i%256)+256)%256],b=v[(((i+1)%256)+256)%256],u=f*f*(3-2*f);return a+(b-a)*u;};}
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
function mk(){const c=document.createElement('canvas');c.width=W;c.height=H;return c;}

// ---------- palette ----------
const PAPER='#EDE6D8';
const INK={red:'#C23A4F',blue:'#8FB0D0',gray:'#55575C',purple:'#6A4C9C'};
let L={}; // layers per pencil
let scratch=mk(),sx=scratch.getContext('2d');

// ---------- tooth tile ----------
const tooth=document.createElement('canvas');tooth.width=tooth.height=256;
{const g=tooth.getContext('2d'),img=g.createImageData(256,256),r=mulberry32(11);
 for(let y=0;y<256;y++)for(let x=0;x<256;x++){const i=(y*256+x)*4;
   // slight horizontal streak so graphite reads as drawn on tooth
   const v=0.42+0.58*r();img.data[i]=img.data[i+1]=img.data[i+2]=0;img.data[i+3]=Math.floor(255*v);}
 g.putImageData(img,0,0);}

// ---------- geometry ----------
function catmull(P,dens){
  if(P.length<3)return P.slice();
  const out=[];const get=i=>P[Math.max(0,Math.min(P.length-1,i))];
  for(let i=0;i<P.length-1;i++){const p0=get(i-1),p1=get(i),p2=get(i+1),p3=get(i+2);
    const seg=Math.max(2,Math.ceil(Math.hypot(p2[0]-p1[0],p2[1]-p1[1])/(dens||5)));
    for(let j=0;j<seg;j++){const t=j/seg,t2=t*t,t3=t2*t;
      out.push([0.5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
                0.5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)]);}}
  out.push(P[P.length-1].slice());return out;}
function resample(P,step){
  const out=[P[0].slice()];let acc=0;
  for(let i=1;i<P.length;i++){const a=P[i-1],b=P[i];const d=Math.hypot(b[0]-a[0],b[1]-a[1]);
    if(d===0)continue;let pos=step-acc;
    while(pos<=d){out.push([a[0]+(b[0]-a[0])*pos/d,a[1]+(b[1]-a[1])*pos/d]);pos+=step;}
    acc=d-(pos-step);}
  const last=P[P.length-1];out.push(last.slice());return out;}

// ---------- pencil stroke ----------
// opts: w, alpha, jit, seed, smooth, taper, over (overshoot px), dbl (double-line prob)
function stroke(layer,pts,o){
  o=o||{};const seed=o.seed||1;const w=o.w||1.6,alpha=o.alpha===undefined?0.9:o.alpha,jit=o.jit===undefined?0.9:o.jit;
  let P=pts.map(p=>p.slice());
  if(o.over){ // overshoot ends a little along the tangent
    const a=P[0],b=P[1],n=P.length,y=P[n-1],z=P[n-2];
    const d1=Math.hypot(a[0]-b[0],a[1]-b[1])||1,d2=Math.hypot(y[0]-z[0],y[1]-z[1])||1;
    P.unshift([a[0]+(a[0]-b[0])/d1*o.over,a[1]+(a[1]-b[1])/d1*o.over]);
    P.push([y[0]+(y[0]-z[0])/d2*o.over,y[1]+(y[1]-z[1])/d2*o.over]);}
  if(o.smooth)P=catmull(P,4);
  const R=resample(P,2.2);const n=R.length;if(n<2)return;
  const nj=noise1(seed*977+3),nw=noise1(seed*977+5);
  const taper=o.taper===undefined?0.18:o.taper;
  // bbox
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const p of R){x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1]);}
  const pad=w*2+jit*3+4;x0=Math.max(0,Math.floor(x0-pad));y0=Math.max(0,Math.floor(y0-pad));x1=Math.min(W,Math.ceil(x1+pad));y1=Math.min(H,Math.ceil(y1+pad));
  if(x1<=x0||y1<=y0)return;
  sx.clearRect(x0,y0,x1-x0,y1-y0);
  sx.save();sx.strokeStyle='#000';sx.lineCap='round';sx.lineJoin='round';
  let totalLen=0;for(let i=1;i<n;i++)totalLen+=Math.hypot(R[i][0]-R[i-1][0],R[i][1]-R[i-1][1]);
  const Q=R.map((p,i)=>{const a=R[Math.max(0,i-1)],b=R[Math.min(n-1,i+1)];let dx=b[0]-a[0],dy=b[1]-a[1];const d=Math.hypot(dx,dy)||1;
    const off=nj(i*2.2/38)*jit;return[p[0]-dy/d*off,p[1]+dx/d*off];});
  for(let i=0;i<n-1;i++){const t=i/(n-1);
    let prof=Math.min(1,t/taper,(1-t)/taper);prof=Math.max(0.15,prof);
    sx.lineWidth=Math.max(0.4,w*Math.pow(prof,0.7)*(0.78+0.3*(0.5+0.5*nw(i*2.2/30))));
    sx.beginPath();sx.moveTo(Q[i][0],Q[i][1]);sx.lineTo(Q[i+1][0],Q[i+1][1]);sx.stroke();}
  sx.restore();
  const g=layer.getContext('2d');g.save();g.globalAlpha=alpha;
  g.drawImage(scratch,x0,y0,x1-x0,y1-y0,x0,y0,x1-x0,y1-y0);g.restore();
  if(o.dbl){const r=mulberry32(seed*13+7);if(r()<o.dbl){stroke(layer,pts,Object.assign({},o,{dbl:0,seed:seed+4001,alpha:alpha*0.45,w:w*0.7,jit:jit*1.8+0.8}));}}
}
// fast thin stroke straight on the layer (hatching, rain)
function fast(layer,pts,o){
  const g=layer.getContext('2d');g.save();g.globalAlpha=o.alpha;g.lineWidth=o.w;g.strokeStyle='#000';g.lineCap='round';
  const r=mulberry32(o.seed||1);g.beginPath();
  const R=o.smooth?catmull(pts,6):pts;
  g.moveTo(R[0][0]+(r()-0.5)*o.jit,R[0][1]+(r()-0.5)*o.jit);
  for(let i=1;i<R.length;i++)g.lineTo(R[i][0]+(r()-0.5)*o.jit,R[i][1]+(r()-0.5)*o.jit);
  g.stroke();g.restore();}

function ellipsePts(cx,cy,rx,ry,rot,a0,a1,n){const p=[];n=n||40;const c=Math.cos(rot||0),s=Math.sin(rot||0);
  for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;const x=Math.cos(a)*rx,y=Math.sin(a)*ry;p.push([cx+x*c-y*s,cy+x*s+y*c]);}return p;}
// hand-drawn loop: slightly more than a full turn, drifting
function loop(layer,cx,cy,rx,ry,o){const r=mulberry32(o.seed||3);const st=-1.9+r()*0.4;
  const p=[];for(let i=0;i<=46;i++){const t=i/46,a=st+t*(Math.PI*2+0.5);const k=1+0.06*Math.sin(t*5+r())+t*0.05;p.push([cx+Math.cos(a)*rx*k,cy+Math.sin(a)*ry*k]);}
  stroke(layer,p,Object.assign({smooth:true,taper:0.08},o));}

const G={

function glyphW(ch){if(ch===' ')return 0.55;const g=G[ch];if(!g)return 0.6;let m=0;for(const s of g)for(const p of s)m=Math.max(m,p[0]);return m;}
function textWidth(str,size){let x=0;for(const ch of str)x+=(glyphW(ch)+0.36)*size*0.66;return x-0.36*size*0.66;}
// size = cap height. Returns width.
function write(layer,str,x,y,size,o){
  o=o||{};const r=mulberry32(o.seed||7);let cx=x;const sw=size*0.66;
  for(const ch of str){
    if(ch!==' '&&G[ch]){
      const bj=(r()-0.5)*size*0.07,sj=1+(r()-0.5)*0.08,rot=(r()-0.5)*0.05;
      for(const s of G[ch]){
        const pts=s.map(p=>{const px=p[0]*sw*sj,py=(p[1]-1)*size*sj;return[cx+px*Math.cos(rot)-py*Math.sin(rot),y+bj+px*Math.sin(rot)+py*Math.cos(rot)];});
        stroke(layer,pts,{w:o.w||1.6,alpha:o.alpha||0.9,jit:o.jit===undefined?0.35:o.jit,seed:Math.floor(r()*1e6),taper:0.12,smooth:s.length>4});
      }}
    cx+=(glyphW(ch)+0.36)*sw;}
  return cx-x;}

// ---------- paper ----------
function paper(seed){
  ctx.fillStyle=PAPER;ctx.fillRect(0,0,W,H);
  // light-table centre lift
  let g=ctx.createRadialGradient(W*0.5,H*0.52,40,W*0.5,H*0.52,W*0.62);
  g.addColorStop(0,'rgba(255,252,244,0.45)');g.addColorStop(1,'rgba(255,252,244,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // aged blotches
  const r=mulberry32(seed);ctx.save();ctx.globalCompositeOperation='multiply';
  for(let i=0;i<22;i++){const x=r()*W,y=r()*H,rad=60+r()*220;const gg=ctx.createRadialGradient(x,y,0,x,y,rad);
    gg.addColorStop(0,'rgba(196,176,140,'+(0.05+r()*0.06)+')');gg.addColorStop(1,'rgba(196,176,140,0)');ctx.fillStyle=gg;ctx.fillRect(x-rad,y-rad,rad*2,rad*2);}
  // grain
  const gt=document.createElement('canvas');gt.width=gt.height=256;{const q=gt.getContext('2d'),im=q.createImageData(256,256),rr=mulberry32(seed+9);
    for(let i=0;i<im.data.length;i+=4){const v=226+rr()*29;im.data[i]=v;im.data[i+1]=v-2;im.data[i+2]=v-6;im.data[i+3]=255;}q.putImageData(im,0,0);
    q.strokeStyle='rgba(130,112,88,0.35)';q.lineWidth=0.6;for(let i=0;i<45;i++){const x=rr()*256,y=rr()*256,a=rr()*Math.PI,l=2+rr()*6;q.beginPath();q.moveTo(x,y);q.quadraticCurveTo(x+Math.cos(a)*l*0.5+rr()*2,y+Math.sin(a)*l*0.5,x+Math.cos(a)*l,y+Math.sin(a)*l);q.stroke();}}
  ctx.globalAlpha=0.55;ctx.fillStyle=ctx.createPattern(gt,'repeat');ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
  // warm vignette
  g=ctx.createRadialGradient(W*0.5,H*0.5,H*0.42,W*0.5,H*0.5,W*0.72);
  g.addColorStop(0,'rgba(170,130,85,0)');g.addColorStop(1,'rgba(150,108,62,0.42)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.restore();}

function composite(name,alpha,blotchy){
  const c=L[name],g=c.getContext('2d');
  g.save();g.globalCompositeOperation='destination-in';g.fillStyle=g.createPattern(tooth,'repeat');g.fillRect(0,0,W,H);g.restore();
  g.save();g.globalCompositeOperation='source-in';g.fillStyle=INK[name];g.fillRect(0,0,W,H);g.restore();
  ctx.save();ctx.globalCompositeOperation='multiply';ctx.globalAlpha=alpha||1;ctx.drawImage(c,0,0);ctx.restore();}

// ---------- the paper boat ----------
// local coords: hull top edge y=0 from -100..100, keel at y=40, sail peak at y=-80
function boatParts(){
  return {
    hull:[[-104,-2],[-64,40],[64,40],[104,-2]],
    rim:[[-104,-2],[104,-2]],
    brim:[[-90,11],[90,11]],
    sail:[[-66,-2],[-4,-96],[62,-2]],
    crease:[[-4,-96],[-2,-2]],
    fold:[[-66,-2],[-30,-20]],fold2:[[62,-2],[28,-18]],
  };}
function xf(pts,b){const c=Math.cos(b.ang),s=Math.sin(b.ang);const sqx=1+(b.sq||0),sqy=1/(1+(b.sq||0));
  return pts.map(p=>{const x=p[0]*b.s*sqx,y=p[1]*b.s*sqy;return[b.x+x*c-y*s,b.y+x*s+y*c];});}
function drawBoat(layer,b,o){
  const P=boatParts(),seed=o.seed||1;const w=o.w||2.4,al=o.alpha===undefined?0.95:o.alpha;
  const k={w:w,alpha:al,jit:o.jit||0.7,over:o.over===undefined?3:o.over,dbl:o.dbl===undefined?0.5:o.dbl,taper:0.1};
  let i=0;
  for(const key of ['hull','rim','sail','crease','brim','fold','fold2']){
    const kk=Object.assign({},k,{seed:seed*50+(i++)});
    if(key==='brim'||key==='fold'||key==='fold2'||key==='crease'){kk.w=w*0.7;kk.alpha=al*0.8;}
    stroke(layer,xf(P[key],b),kk);}
}
function boatConstruction(layer,b,o){
  const seed=o.seed||2,al=o.alpha||0.7,w=o.w||1.3;
  // bounding ellipse of hull
  const e=ellipsePts(0,14,118,38,0,0,Math.PI*2+0.3,40);stroke(layer,xf(e,b),{w:w,alpha:al,jit:1.4,seed:seed,smooth:true});
  // centre / tilt axis, overshooting
  stroke(layer,xf([[-150,6],[150,6]],b),{w:w,alpha:al*0.8,jit:1,seed:seed+1});
  stroke(layer,xf([[-3,-112],[-1,56]],b),{w:w,alpha:al*0.8,jit:1,seed:seed+2});
  // rough sail triangle, looser
  stroke(layer,xf([[-74,4],[-6,-106],[70,4]],b),{w:w,alpha:al*0.7,jit:2.2,seed:seed+3});
  // rough hull box
  stroke(layer,xf([[-112,-6],[-70,46],[70,46],[114,-8]],b),{w:w,alpha:al*0.6,jit:2.4,seed:seed+4});
}
function boatPeak(b){return xf([[-4,-96]],b)[0];}
function boatKeel(b){return xf([[0,40]],b)[0];}

// ---------- slate + counter ----------
function slate(title,seed){
  write(L.gray,'PROD. 2026-A   SEQ. 3   SC. 12',70,86,17,{w:1.5,alpha:0.95,seed:seed,jit:0.2});
  const tw=write(L.red,title,70,132,29,{w:2.4,alpha:0.95,seed:seed+1,jit:0.35});
  stroke(L.red,[[66,145],[70+tw*0.5,143],[70+tw+10,146]],{w:2.2,alpha:0.9,jit:0.8,seed:seed+2,smooth:true,taper:0.25});
}
function counter(num,label,circled,seed){
  const size=34;const tw=textWidth(num,size);const x=1198-tw/2;
  write(L.gray,num,x,650,size,{w:2.4,alpha:0.95,seed:seed,jit:0.3});
  if(circled)loop(L.gray,1198,633,tw/2+22,26,{w:1.6,alpha:0.8,seed:seed+3,jit:0.8});
  const lw=textWidth(label,15);write(L.gray,label,1198-lw/2,690,15,{w:1.4,alpha:0.9,seed:seed+5,jit:0.2});
}
function circNum(layer,num,cx,cy,o){o=o||{};const size=o.size||17;const tw=textWidth(num,size);
  write(layer,num,cx-tw/2,cy+size/2,size,{w:1.5,alpha:o.alpha||0.9,seed:o.seed||5,jit:0.25});
  loop(layer,cx,cy,tw/2+13,size*0.95,{w:1.3,alpha:(o.alpha||0.9)*0.85,seed:(o.seed||5)+9,jit:0.6});}
// dashed arc with cross ticks
function dashedArc(layer,pts,o){
  const C=catmull(pts,4);const R=resample(C,3);let s=o.seed||9;const dash=o.dash||5,gap=o.gap||4;
  let i=0;while(i<R.length-1){const j=Math.min(R.length-1,i+dash);stroke(layer,R.slice(i,j+1),{w:o.w||1.4,alpha:o.alpha||0.8,jit:0.3,seed:s++,taper:0.3});i=j+gap;}
  if(o.ticks){for(let k=o.tickEvery;k<R.length-2;k+=o.tickEvery){const a=R[k-1],b=R[k+1];const dx=b[0]-a[0],dy=b[1]-a[1],d=Math.hypot(dx,dy)||1;
    const nx=-dy/d*6,ny=dx/d*6;stroke(layer,[[R[k][0]-nx,R[k][1]-ny],[R[k][0]+nx,R[k][1]+ny]],{w:1.2,alpha:(o.alpha||0.8)*0.9,jit:0.2,seed:s++,taper:0.3});}}
  return R;}
function arrow(layer,pts,o){const C=catmull(pts,4);stroke(layer,C,Object.assign({w:1.4,alpha:0.85,jit:0.5,taper:0.12},o));
  const n=C.length,a=C[n-4]||C[0],b=C[n-1];const ang=Math.atan2(b[1]-a[1],b[0]-a[0]);const hl=11;
  stroke(layer,[[b[0]-Math.cos(ang-0.45)*hl,b[1]-Math.sin(ang-0.45)*hl],b,[b[0]-Math.cos(ang+0.45)*hl,b[1]-Math.sin(ang+0.45)*hl]],Object.assign({w:1.4,alpha:0.85,jit:0.3,taper:0.2},o,{seed:(o.seed||1)+77}));}

// hatching inside polygon (fast strokes)
function hatch(layer,poly,ang,sp,o){
  const g=layer.getContext('2d');g.save();g.beginPath();g.moveTo(poly[0][0],poly[0][1]);for(const p of poly)g.lineTo(p[0],p[1]);g.closePath();g.clip();
  if(o.clipOut){g.beginPath();g.rect(0,0,W,H);for(const q of o.clipOut){g.moveTo(q[0][0],q[0][1]);for(const p of q)g.lineTo(p[0],p[1]);g.closePath();}g.clip('evenodd');}
  const r=mulberry32(o.seed||5);const xs=poly.map(p=>p[0]),ys=poly.map(p=>p[1]);
  const cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2;const R=Math.hypot(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys))/2+20;
  const dx=Math.cos(ang),dy=Math.sin(ang);
  for(let d=-R;d<R;d+=sp*(0.7+r()*0.6)){const ox=cx-dy*d,oy=cy+dx*d;
    let a=o.dens?o.dens(ox,oy):1;for(const c of CLEAR){const dd=Math.hypot(ox-c[0],oy-c[1]);}if(r()>a)continue;
    const L0=R*(0.9+r()*0.2);
    // broken strokes: split into 1-3 pieces
    let t=-L0;while(t<L0){const len=40+r()*160;const t2=Math.min(L0,t+len);
      {const mx=ox+dx*(t+t2)/2,my=oy+dy*(t+t2)/2;let keep=1;for(const c of CLEAR){keep*=Math.max(0,Math.min(1,(Math.hypot(mx-c[0],my-c[1])-c[2])/c[3]));}if(r()>keep){t=t2+r()*o.gap;continue;}}
      fast(layer,[[ox+dx*t,oy+dy*t],[ox+dx*(t+t2)/2+(r()-0.5)*2,oy+dy*(t+t2)/2+(r()-0.5)*2],[ox+dx*t2,oy+dy*t2]],{w:o.w||1,alpha:(o.alpha||0.35)*(0.6+r()*0.5),jit:0.8,seed:Math.floor(r()*1e6)});
      t=t2+r()*o.gap;}}
  g.restore();}

// ---------- APPROVED rubber stamp ----------
function stamp(cx,cy,rot){
  const c=mk(),g=c.getContext('2d');
  const bw=textWidth('APPROVED',50)+84,bh=128;
  g.save();g.translate(cx,cy);g.rotate(rot);g.strokeStyle='#000';g.lineJoin='round';
  function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.quadraticCurveTo(x+w,y,x+w,y+r);g.lineTo(x+w,y+h-r);g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);g.lineTo(x+r,y+h);g.quadraticCurveTo(x,y+h,x,y+h-r);g.lineTo(x,y+r);g.quadraticCurveTo(x,y,x+r,y);g.closePath();}
  g.lineWidth=6;rr(-bw/2,-bh/2,bw,bh,12);g.stroke();
  g.lineWidth=2.2;rr(-bw/2+10,-bh/2+10,bw-20,bh-20,7);g.stroke();
  g.restore();
  // letters via stroke font on a temp layer, transformed
  const tl=mk();
  const big='APPROVED',bs=50;const bwid=textWidth(big,bs);
  const tmpL={getContext:()=>tl.getContext('2d')};
  // draw letters in local space then rotate by drawing onto c with transform
  const lc=mk();write(lc,big,640-bwid/2,360+6,bs,{w:7.6,alpha:1,seed:77,jit:0.15});
  const small="PENCIL TEST · SC. 12 · SEP 29 '26",ss=12;const swid=textWidth(small,ss);
  write(lc,small,640-swid/2,360+36,ss,{w:1.9,alpha:1,seed:78,jit:0.1});
  stroke(lc,[[640-bwid/2,360+15],[640+bwid/2,360+15]],{w:1.6,alpha:1,seed:79,jit:0.2});
  g.save();g.translate(cx,cy);g.rotate(rot);g.drawImage(lc,-640,-360-10);g.restore();
  // ink texture: coarse dropout noise + fine tooth
  const n=mk(),q=n.getContext('2d');const r=mulberry32(99);
  q.fillStyle='#000';q.fillRect(0,0,W,H);q.globalCompositeOperation='destination-out';
  for(let i=0;i<900;i++){const x=cx-190+r()*380,y=cy-110+r()*220,rad=1+r()*r()*7;q.globalAlpha=0.35+r()*0.6;q.beginPath();q.arc(x,y,rad,0,7);q.fill();}
  // pressure falloff on one side
  q.globalCompositeOperation='destination-out';const gr=q.createLinearGradient(cx-180,cy,cx+180,cy);gr.addColorStop(0,'rgba(0,0,0,0.35)');gr.addColorStop(0.5,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,0.1)');q.globalAlpha=1;q.fillStyle=gr;q.fillRect(0,0,W,H);
  g.save();g.globalCompositeOperation='destination-in';g.drawImage(n,0,0);g.restore();
  L.purple=c;composite('purple',0.9);
}

window.drawFrame=function(which){if(which==='a')frameA();else frameB();window.DONE=true;};
window.READY=true;
</script>
