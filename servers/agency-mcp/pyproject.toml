[project]
name = "agency-mcp"
version = "0.0.1"
description = "Unified FastMCP server for the Agency System plugin (music + novel + jules + agentic)."
requires-python = ">=3.11"
dependencies = [
    "fastmcp[code-mode]>=3.1.0",
    "jsonschema>=4.21.0",
    "PyYAML>=6.0",
    "scipy>=1.7.0",
    "pyloudnorm>=0.1.1",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "numpy>=1.20.0",
    "tiktoken",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agency_mcp"]
