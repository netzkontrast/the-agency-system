[project]
name = "agency-mcp"
version = "0.0.1"
description = "Unified FastMCP server for the Agency System plugin (music + novel + jules + agentic)."
requires-python = ">=3.11"
dependencies = [
    "fastmcp[code-mode]>=3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agency_mcp"]
