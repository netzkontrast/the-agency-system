 (Math.random() - 0.5) * 0.0001,\n          vy: (Math.random() - 0.5) * 0.0001,\n          op: 0.08 + Math.random() * 0.25,\n        }));\n\n        let raf = null, t0 = null, active = false;\n        let W = 0, H = 0;\n\n        function resize() {\n          const rect = scene.getBoundingClientRect();\n          W = cv.width  = rect.width  || scene.offsetWidth;\n          H = cv.height = rect.height || 280;\n        }\n\n        function draw(ts) {\n          if (!active) return;\n          raf = requestAnimationFrame(draw);\n          if (!t0) t0 = ts;\n          const t = (ts - t0) * 0.001;\n          const ctx = cv.getContext('2d');\n\n          if (cv.width !== scene.offsetWidth) resize();\n          ctx.clearRect(0, 0, W, H);\n\n          const cx = W / 2, cy = H / 2;\n\n          // Background glow — subtle\n          const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.min(W, H) * 0.55);\n          const ga = 0.02 + (1-kohNum)*0.06;\n          grd.addColorStop(0, color.replace('#', 'rgba(') === color ? `rgba(255,215,0,${ga})` :\n            `${hexToRgba(color, ga)}`);\n          grd.addColorStop(1, 'rgba(11,13,23,0)');\n          ctx.fillStyle = grd; ctx.fillRect(0,0,W,H);\n\n          // Dashed axis line\n          ctx.beginPath();\n          ctx.moveTo(0, cy); ctx.lineTo(W, cy);\n          ctx.strokeStyle = color; ctx.globalAlpha = 0.25;\n          ctx.lineWidth = 0.5; ctx.setLineDash([3, 9]);\n          ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;\n\n          // Axis ticks\n          const ticks = 18;\n          for (let i = 0; i <= ticks; i++) {\n            const tx = i / ticks * W;\n            ctx.beginPath();\n            ctx.moveTo(tx, cy-4); ctx.lineTo(tx, cy+4);\n            ctx.strokeStyle = color; ctx.globalAlpha = 0.18;\n            ctx.lineWidth = 0.4; ctx.stroke(); ctx.globalAlpha = 1;\n          }\n\n          // Harmonic echo (thin, smooth, drifts slightly ahead in phase)\n          for (let k = 1; k <= 3; k++) {\n            ctx.beginPath();\n            for (let x = 0; x <= W; x += 3) {\n              const y = cy + Math.sin((x * period + t * (0.4 + k*0.15) + k) * Math.PI * 2) * amp * (0.45 - k*0.1);\n              x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);\n            }\n            ctx.strokeStyle = color; ctx.lineWidth = 0.5;\n            ctx.globalAlpha = 0.15 - k * 0.03; ctx.stroke(); ctx.globalAlpha = 1;\n          }\n\n          // Main waveform — noisy, thick, animated\n          ctx.beginPath();\n          for (let x = 0; x <= W; x += 2) {\n            const n = noise > 0 ? (Math.sin(x*0.3+t*7.3)*0.5 + Math.sin(x*0.7+t*13.1)*0.3 + Math.sin(x*1.4+t*5.7)*0.2) * noise : 0;\n            const y = cy + Math.sin((x * period + t * 0.35) * Math.PI * 2) * amp + n;\n            x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);\n          }\n          ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.globalAlpha = 0.85; ctx.stroke(); ctx.globalAlpha = 1;\n\n          // Particles drifting\n          particles.forEach(p => {\n            p.x += p.vx; p.y += p.vy;\n            if (p.x < 0) p.x = 1; if (p.x > 1) p.x = 0;\n            if (p.y < 0) p.y = 1; if (p.y > 1) p.y = 0;\n            ctx.beginPath();\n            ctx.arc(p.x*W, p.y*H, p.r, 0, Math.PI*2);\n            ctx.fillStyle = color; ctx.globalAlpha = p.op; ctx.fill(); ctx.globalAlpha = 1;\n          });\n\n          // Central sigil — slowly rotates or pulses\n          ctx.save();\n          ctx.translate(cx, cy);\n          const pulse = 1 + Math.sin(t * 0.6) * 0.06;\n          ctx.scale(pulse, pulse);\n          ctx.globalAlpha = 0.22;\n          ctx.strokeStyle = color; ctx.lineWidth = 0.7;\n\n          if (tier === 0) {\n            // Concentric circles (homöostase)\n            [50,34,18].forEach(r => {\n              ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.stroke();\n            });\n          } else if (tier === 1) {\n            // Rotating hexagon (latenz)\n            ctx.rotate(t * 0.08);\n            ctx.beginPath();\n            for (let i=0;i<6;i++){const a=(i/6)*Math.PI*2;i===0?ctx.moveTo(Math.cos(a)*50,Math.sin(a)*50):ctx.lineTo(Math.cos(a)*50,Math.sin(a)*50);}\n            ctx.closePath(); ctx.stroke();\n          } else if (tier === 2) {\n            // Pulsing triangle + exclamation (alert)\n            ctx.beginPath();\n            ctx.moveTo(0,-55); ctx.lineTo(50,42); ctx.lineTo(-50,42); ctx.closePath(); ctx.stroke();\n            ctx.globalAlpha = 0.35;\n            ctx.beginPath(); ctx.moveTo(0,-20); ctx.lineTo(0,12); ctx.stroke();\n            ctx.beginPath(); ctx.arc(0,24,2,0,Math.PI*2); ctx.fillStyle=color; ctx.fill();\n          } else {\n            // Fracture lines (kernel panic) — jitter with t\n            const jitter = Math.sin(t*8)*2;\n            ctx.globalAlpha = 0.35 + Math.sin(t*3)*0.08;\n            ctx.lineWidth = 0.9;\n            const flines = [[-70,-45,-20,-8],[-20,-8,10,28],[10,28,65,10],[-20,-8,-45,28],[10,28,28,65]];\n            flines.forEach(([x1,y1,x2,y2]) => {\n              ctx.beginPath(); ctx.moveTo(x1+jitter,y1); ctx.lineTo(x2,y2+jitter); ctx.stroke();\n            });\n          }\n\n          ctx.restore();\n          ctx.globalAlpha = 1;\n        }\n\n        // Only animate when visible\n        const obs = new IntersectionObserver(entries => {\n          entries.forEach(e => {\n            if (e.isIntersecting && !active) {\n              active = true; resize(); raf = requestAnimationFrame(draw);\n            } else if (!e.isIntersecting && active) {\n              active = false; cancelAnimationFrame(raf);\n            }\n          });\n        }, { threshold: 0.05 });\n        obs.observe(scene);\n      });\n\n      function hexToRgba(hex, a) {\n        const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);\n        return `rgba(${r},${g},${b},${a})`;\n      }\n    })();\n\n    // Inject marginalia — positioned absolutely next to sections\n    const sections = root.querySelectorAll('.section');\n    sections.forEach((sec, idx) => {\n      const meta = SECTION_META[sec.id.replace('sec-','')] || {annot: []};\n      meta.annot.forEach((text, j) => {\n        const note = document.createElement('div');\n        note.className = 'margin-note' + (j % 2 === 0 ? '' : ' left-side');\n        const target = j % 2 === 0 ? marginRight : marginLeft;\n        // Set position based on section top\n        note.style.top = (sec.offsetTop + 80 + j * 140) + 'px';\n        note.innerHTML = `<span class=\"label\">§ ${String(idx+1).padStart(2,'0')} · NOTE ${j+1}<\u002Fspan>${text}`;\n        target.appendChild(note);\n      });\n    });\n\n    // ─── Crack overlay SVG — animated breaking glass ────────────────────────\n    function buildCrackSVG() {\n      const W = window.innerWidth, H = window.innerHeight;\n      const cx = W * (0.38 + Math.random() * 0.24);\n      const cy = H * (0.38 + Math.random() * 0.24);\n      let paths = '';\n      let animIdx = 0;\n\n      // Generate one fissure starting from impact point\n      function makeFissure(sx, sy, angleBias, isMajor) {\n        let d = `M ${sx.toFixed(1)} ${sy.toFixed(1)}`;\n        let x = sx, y = sy;\n        const steps = isMajor ? (10 + Math.floor(Math.random() * 8)) : (4 + Math.floor(Math.random() * 4));\n        const stepLen = isMajor ? (60 + Math.random() * 80) : (20 + Math.random() * 40);\n        for (let s = 0; s < steps; s++) {\n          const angle = angleBias + (Math.random() - 0.5) * 1.1;\n          x += Math.cos(angle) * stepLen * (0.6 + Math.random() * 0.8);\n          y += Math.sin(angle) * stepLen * (0.6 + Math.random() * 0.8);\n          d += ` L ${x.toFixed(1)} ${y.toFixed(1)}`;\n        }\n        // Estimate path length for dasharray\n        const pathLen = steps * stepLen * 1.2;\n        const sw = isMajor ? (0.8 + Math.random() * 2.2) : (0.3 + Math.random() * 0.9);\n        const col = isMajor\n          ? (Math.random() < 0.5 ? '#FF4500' : '#FFD700')\n          : (Math.random() < 0.4 ? '#FF4500' : 'rgba(232,230,223,0.6)');\n        const delay = (animIdx * 0.12 + Math.random() * 0.08).toFixed(2);\n        const dur   = (0.25 + Math.random() * 0.35).toFixed(2);\n        animIdx++;\n        // Glow copy\n        paths += `<path d=\"${d}\" stroke=\"${col}\" stroke-width=\"${(sw * 4).toFixed(1)}\" fill=\"none\" opacity=\"0.06\"\n          stroke-dasharray=\"${pathLen}\" stroke-dashoffset=\"${pathLen}\"\n          style=\"animation: crack-draw ${dur}s ease-out ${delay}s forwards;\"/>`;\n        // Main crack line\n        paths += `<path d=\"${d}\" stroke=\"${col}\" stroke-width=\"${sw.toFixed(1)}\" fill=\"none\" opacity=\"${(0.5 + Math.random() * 0.45).toFixed(2)}\"\n          stroke-linecap=\"round\"\n          stroke-dasharray=\"${pathLen}\" stroke-dashoffset=\"${pathLen}\"\n          style=\"animation: crack-draw ${dur}s ease-out ${delay}s forwards;\"/>`;\n        return { x, y };\n      }\n\n      // 5-7 major fissures radiating from impact\n      const majorCount = 5 + Math.floor(Math.random() * 3);\n      for (let i = 0; i < majorCount; i++) {\n        const angle = (i / majorCount) * Math.PI * 2 + (Math.random() - 0.5) * 0.4;\n        const ep = makeFissure(cx, cy, angle, true);\n        // 1-2 sub-branches from mid-point\n        const bCount = 1 + Math.floor(Math.random() * 2);\n        for (let b = 0; b < bCount; b++) {\n          const mx = cx + (ep.x - cx) * (0.3 + Math.random() * 0.4);\n          const my = cy + (ep.y - cy) * (0.3 + Math.random() * 0.4);\n          makeFissure(mx, my, angle + (Math.random() - 0.5) * 1.4, false);\n        }\n      }\n\n      // Concentric stress rings (partial arcs, also animated)\n      for (let r = 0; r < 3; r++) {\n        const radius = 40 + r * 55 + Math.random() * 30;\n        const startA = Math.random() * Math.PI * 2;\n        const spanA  = (0.3 + Math.random() * 1.2);\n        const endA   = startA + spanA;\n        const x1 = cx + Math.cos(startA) * radius, y1 = cy + Math.sin(startA) * radius;\n        const x2 = cx + Math.cos(endA)   * radius, y2 = cy + Math.sin(endA)   * radius;\n        const arcLen = radius * spanA;\n        const delay = (r * 0.15 + Math.random() * 0.1).toFixed(2);\n        paths += `<path d=\"M ${x1.toFixed(1)} ${y1.toFixed(1)} A ${radius} ${radius} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}\"\n          fill=\"none\" stroke=\"rgba(255,215,0,0.3)\" stroke-width=\"${(0.4 + r * 0.2).toFixed(1)}\"\n          stroke-dasharray=\"${arcLen}\" stroke-dashoffset=\"${arcLen}\"\n          style=\"animation: crack-draw 0.4s ease-out ${delay}s forwards;\"/>`;\n      }\n\n      return `<svg viewBox=\"0 0 ${W} ${H}\" width=\"${W}\" height=\"${H}\" xmlns=\"http://www.w3.org/2000/svg\">\n        <defs>\n          <filter id=\"cglow\" x=\"-50%\" y=\"-50%\" width=\"200%\" height=\"200%\">\n            <feGaussianBlur stdDeviation=\"3\" result=\"b\"/>\n            <feMerge><feMergeNode in=\"b\"/><feMergeNode in=\"SourceGraphic\"/><\u002FfeMerge>\n          <\u002Ffilter>\n        <\u002Fdefs>\n        ${paths}\n      <\u002Fsvg>`;\n    }\n\n    const crackOverlay = document.getElementById('crack-overlay');\n    let cracksBuilt = false;\n    function showCracks() {\n      if (!cracksBuilt) { crackOverlay.innerHTML = buildCrackSVG(); cracksBuilt = true; }\n      crackOverlay.classList.add('show');\n    }\n    function hideCracks() {\n      crackOverlay.classList.remove('show');\n      cracksBuilt = false; // rebuild next time (randomised)\n    }\n\n    // ─── Ghost signatures ───────────────────────────────────────────────\n    // Alter codes flash up at random positions during high-tier sections\n    const GHOST_SIGS = [\n      { code: '◈ · ·',    color: '#a8c0d8' },\n      { code: '⤬ ⤬',      color: '#d4a0c8' },\n      { code: '◌ ◌ ◌',   color: '#f0a878' },\n      { code: '▮▮▮',      color: '#FF4500' },\n      { code: '▼ ▼',      color: '#8a87a8' },\n      { code: '◌ ✦ ◌',   color: '#FFDF00' },\n      { code: '/ / /',    color: '#4a7fb5' },\n      { code: '· · ·',   color: '#00FF9F' },\n      { code: '□□□',      color: '#cccccc' },\n      { code: '◉ ◉',      color: '#FFD700' },\n      { code: '✕ ✕ ✕',   color: '#FCEE0C' },\n      { code: '|||',      color: '#FF4500' },\n      { code: '≡ ≡ ≡',   color: '#a8c0d8' },\n      { code: '↯',        color: '#FF4500' },\n      { code: '◆ ◆',      color: '#FFDF00' },\n    ];\n    let ghostTimer = null;\n    let ghostIntensity = 0;\n\n    function spawnGhost() {\n      if (ghostIntensity <= 0 || document.body.classList.contains('calm')) return;\n      const sig = GHOST_SIGS[Math.floor(Math.random() * GHOST_SIGS.length)];\n      const el = document.createElement('div');\n      el.className = 'ghost-sig' + (Math.random() < 0.25 ? ' long' : '');\n      el.textContent = sig.code;\n      el.style.color = sig.color;\n      const edge = Math.random();\n      if (edge < 0.3) {\n        el.style.left = (Math.random() * 12) + 'vw';\n        el.style.top = (10 + Math.random() * 80) + 'vh';\n      } else if (edge < 0.6) {\n        el.style.right = (Math.random() * 12) + 'vw';\n        el.style.top = (10 + Math.random() * 80) + 'vh';\n      } else {\n        el.style.left = (10 + Math.random() * 80) + 'vw';\n        el.style.top = (10 + Math.random() * 80) + 'vh';\n      }\n      const fs = 11 + Math.random() * (4 + ghostIntensity * 8);\n      el.style.fontSize = fs + 'px';\n      document.body.appendChild(el);\n      requestAnimationFrame(() => el.classList.add('show'));\n      setTimeout(() => el.remove(), 2000);\n    }\n\n    function scheduleGhost() {\n      if (ghostTimer) clearTimeout(ghostTimer);\n      if (ghostIntensity <= 0) return;\n      const delay = (1200 - ghostIntensity * 1000) + Math.random() * 800;\n      ghostTimer = setTimeout(() => {\n        spawnGhost();\n        if (ghostIntensity > 0.7 && Math.random() < 0.5) spawnGhost();\n        scheduleGhost();\n      }, delay);\n    }\n\n    // HUD live updates as user scrolls\n    const hudKoh = document.getElementById('hud-koh');\n    const hudSec = document.getElementById('hud-sec');\n    const hudTier = document.getElementById('hud-tier');\n    const progress = document.getElementById('progress');\n\n    function updateHud() {\n      const h = document.documentElement;\n      const pct = (h.scrollTop / (h.scrollHeight - h.clientHeight)) * 100;\n      progress.style.width = pct + '%';\n      const center = h.scrollTop + window.innerHeight / 3;\n      let currentIdx = 0;\n      let currentMeta = SECTION_META.vorwort;\n      let currentId = 'vorwort';\n      sections.forEach((s, i) => {\n        if (s.offsetTop <= center) {\n          currentIdx = i;\n          currentId = s.id.replace('sec-','');\n          currentMeta = SECTION_META[currentId] || currentMeta;\n        }\n      });\n      hudKoh.textContent = currentMeta.koh;\n      hudSec.textContent = String(currentIdx+1).padStart(2,'0') + ' / 14';\n      hudTier.textContent = currentMeta.tier;\n      hudTier.style.color = ['#4a7fb5','#3B3355','#FFD700','#FF4500','#FFDF00'][currentMeta.tier] || '#fff';\n\n      // Climax orchestration\n      const kaelPrelude = document.querySelector('.kael-prelude');\n      const voidBefore  = document.querySelector('.void-before-kael');\n      const kaelPreludeTop = kaelPrelude ? kaelPrelude.getBoundingClientRect().top + window.scrollY : Infinity;\n      const voidTop        = voidBefore  ? voidBefore.getBoundingClientRect().top  + window.scrollY : Infinity;\n\n      // Calm starts when the void spacer enters the viewport\n      const inKaelZone = h.scrollTop > voidTop - window.innerHeight * 0.5;\n\n      const climaxIds = ['kollaps', 'trennung'];\n      const inClimaxSection = climaxIds.includes(currentId);\n\n      if (inKaelZone) {\n        // Everything goes quiet\n        document.body.classList.add('calm');\n        document.body.classList.remove('show','deep','peak','shake','climax');\n        ghostIntensity = 0;\n        if (ghostTimer) { clearTimeout(ghostTimer); ghostTimer = null; }\n        hideCracks();\n      } else if (inClimaxSection) {\n        document.body.classList.remove('calm');\n        document.body.classList.add('climax');\n        requestAnimationFrame(() => document.body.classList.add('show'));\n\n        if (currentId === 'kollaps') {\n          document.body.classList.remove('deep','peak','shake');\n          ghostIntensity = 0.45;\n          hideCracks();\n        } else if (currentId === 'trennung') {\n          const trEl = document.getElementById('sec-trennung');\n          const tProgress = Math.min(1, Math.max(0, (h.scrollTop - (trEl.getBoundingClientRect().top + window.scrollY)) / trEl.offsetHeight));\n          if (tProgress < 0.3) {\n            document.body.classList.add('deep');\n            document.body.classList.remove('peak','shake');\n            ghostIntensity = 0.7;\n            hideCracks();\n          } else if (tProgress < 0.65) {\n            document.body.classList.add('deep','peak');\n            document.body.classList.remove('shake');\n            ghostIntensity = 0.88;\n            showCracks();\n          } else {\n            document.body.classList.add('deep','peak','shake');\n            ghostIntensity = 1.0;\n            showCracks();\n          }\n        }\n        if (!ghostTimer) scheduleGhost();\n      } else {\n        document.body.classList.remove('calm','show','deep','peak','shake');\n        hideCracks();\n        const preClimax = ['schrecken','kaskade'];\n        if (preClimax.includes(currentId)) {\n          ghostIntensity = currentId === 'kaskade' ? 0.4 : 0.2;\n          if (!ghostTimer) scheduleGhost();\n        } else {\n          ghostIntensity = 0;\n          if (ghostTimer) { clearTimeout(ghostTimer); ghostTimer = null; }\n        }\n        setTimeout(() => {\n          if (!climaxIds.includes(currentId)) document.body.classList.remove('climax');\n        }, 1800);\n      }\n    }\n    // Throttle scroll with RAF — prevents layout thrash on every pixel\n    let _ticking = false;\n    window.addEventListener('scroll', () => {\n      if (!_ticking) {\n        requestAnimationFrame(() => { updateHud(); _ticking = false; });\n        _ticking = true;\n      }\n    }, { passive: true });\n    updateHud();\n\n    // Recompute marginalia positions on resize\n    window.addEventListener('resize', () => {\n      marginRight.innerHTML = '';\n      marginLeft.innerHTML = '';\n      sections.forEach((sec, idx) => {\n        const meta = SECTION_META[sec.id.replace('sec-','')] || {annot: []};\n        meta.annot.forEach((text, j) => {\n          const note = document.createElement('div');\n          note.className = 'margin-note' + (j % 2 === 0 ? '' : ' left-side');\n          const target = j % 2 === 0 ? marginRight : marginLeft;\n          note.style.top = (sec.offsetTop + 80 + j * 140) + 'px';\n          note.innerHTML = `<span class=\"label\">§ ${String(idx+1).padStart(2,'0')} · NOTE ${j+1}<\u002Fspan>${text}`;\n          target.appendChild(note);\n        });\n      });\n    });\n\n    if (location.search.includes('print=1')) setTimeout(() => window.print(), 800);\n  })();\n  <\u002Fscript>\n  <script>\n  // Tweaks — maximal\n  (function() {\n    const DEFAULTS = /*EDITMODE-BEGIN*/{\n      \"measure\": 38,\n      \"fontSize\": 18,\n      \"leading\": 1.7,\n      \"glitch\": true,\n      \"marginalia\": true,\n      \"hud\": true,\n      \"diagrams\": true\n    }/*EDITMODE-END*/;\n    let state = {...DEFAULTS};\n    let open = false;\n    const root = document.getElementById('tweaks-root');\n    function apply() {\n      const c = document.documentElement.style;\n      c.setProperty('--measure', state.measure + 'rem');\n      c.setProperty('--fs-body', state.fontSize + 'px');\n      c.setProperty('--leading', state.leading);\n      document.querySelectorAll('.glitch').forEach(el => el.style.animationPlayState = state.glitch ? 'running' : 'paused');\n      document.querySelectorAll('.margin-note').forEach(el => el.style.display = state.marginalia ? '' : 'none');\n      document.getElementById('hud').style.display = state.hud ? '' : 'none';\n      document.querySelectorAll('.resonance-scene').forEach(el => el.style.display = state.diagrams ? '' : 'none');\n    }\n    function persist(e) { try { window.parent.postMessage({type:'__edit_mode_set_keys', edits:e}, '*'); } catch(_) {} }\n    function render() {\n      if (!open) { root.innerHTML = ''; return; }\n      root.innerHTML = `\n      <div style=\"position:fixed;bottom:16px;right:16px;width:300px;background:#0B0D17;color:#e8e6df;font-family:'JetBrains Mono',monospace;font-size:11px;padding:18px 20px;border:1px solid #FF4500;box-shadow:0 12px 40px rgba(255,69,0,0.15);z-index:1000;\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;letter-spacing:0.2em;text-transform:uppercase;color:#FF4500;font-size:10px;\">\n          <span>◉ TWEAKS · MAXIMAL<\u002Fspan>\n          <button id=\"tw-close\" style=\"background:none;border:none;color:#5a554a;cursor:pointer;font-size:18px;line-height:1;padding:0;\">×<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"margin-bottom:14px;\">\n          <div style=\"display:flex;justify-content:space-between;margin-bottom:6px;color:#5a554a;font-size:10px;letter-spacing:0.15em;\"><span>SATZBREITE<\u002Fspan><span>${state.measure}rem<\u002Fspan><\u002Fdiv>\n          <input type=\"range\" id=\"m\" min=\"28\" max=\"50\" step=\"1\" value=\"${state.measure}\" style=\"width:100%;accent-color:#FFD700;\">\n        <\u002Fdiv>\n        <div style=\"margin-bottom:14px;\">\n          <div style=\"display:flex;justify-content:space-between;margin-bottom:6px;color:#5a554a;font-size:10px;letter-spacing:0.15em;\"><span>SCHRIFTGRÖSSE<\u002Fspan><span>${state.fontSize}px<\u002Fspan><\u002Fdiv>\n          <input type=\"range\" id=\"fs\" min=\"15\" max=\"24\" step=\"0.5\" value=\"${state.fontSize}\" style=\"width:100%;accent-color:#FFD700;\">\n        <\u002Fdiv>\n        <div style=\"margin-bottom:14px;\">\n          <div style=\"display:flex;justify-content:space-between;margin-bottom:6px;color:#5a554a;font-size:10px;letter-spacing:0.15em;\"><span>ZEILENABSTAND<\u002Fspan><span>${state.leading}<\u002Fspan><\u002Fdiv>\n          <input type=\"range\" id=\"l\" min=\"1.4\" max=\"2.0\" step=\"0.05\" value=\"${state.leading}\" style=\"width:100%;accent-color:#FFD700;\">\n        <\u002Fdiv>\n        ${[\n          ['glitch','GLITCH-ANIMATION'],\n          ['marginalia','MARGINALIEN'],\n          ['hud','HUD-OVERLAY'],\n          ['diagrams','RESONANZ-DIAGRAMME']\n        ].map(([k,l])=>`\n          <div style=\"display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid #1f222b;\">\n            <span style=\"color:#a8a397;font-size:10px;letter-spacing:0.15em;\">${l}<\u002Fspan>\n            <button class=\"tg\" data-k=\"${k}\" style=\"background:${state[k]?'#FF4500':'transparent'};color:${state[k]?'#0B0D17':'#5a554a'};border:1px solid ${state[k]?'#FF4500':'#1f222b'};padding:5px 14px;font-family:inherit;font-size:9px;cursor:pointer;letter-spacing:0.15em;\">${state[k]?'AN':'AUS'}<\u002Fbutton>\n          <\u002Fdiv>`).join('')}\n        <button id=\"prn\" style=\"margin-top:14px;width:100%;background:transparent;color:#FFD700;border:1px solid #FFD700;padding:10px;font-family:inherit;font-size:10px;cursor:pointer;text-transform:uppercase;letter-spacing:0.2em;\">▼ PDF / Drucken<\u002Fbutton>\n      <\u002Fdiv>`;\n      document.getElementById('tw-close').onclick=()=>{open=false;render();try{window.parent.postMessage({type:'__edit_mode_dismissed'},'*')}catch(_){}};\n      document.getElementById('m').oninput = e=>{state.measure=+e.target.value;apply();persist({measure:state.measure});render();};\n      document.getElementById('fs').oninput = e=>{state.fontSize=+e.target.value;apply();persist({fontSize:state.fontSize});render();};\n      document.getElementById('l').oninput = e=>{state.leading=+e.target.value;apply();persist({leading:state.leading});render();};\n      document.querySelectorAll('.tg').forEach(b=>b.onclick=()=>{state[b.dataset.k]=!state[b.dataset.k];apply();persist({[b.dataset.k]:state[b.dataset.k]});render();});\n      document.getElementById('prn').onclick=()=>window.open(window.location.pathname + '?print=1', '_blank');\n    }\n    window.addEventListener('message', e=>{const d=e.data||{};if(d.type==='__activate_edit_mode'){open=true;render();}if(d.type==='__deactivate_edit_mode'){open=false;render();}});\n    apply();\n    try { window.parent.postMessage({type:'__edit_mode_available'},'*'); } catch(_){}\n  })();\n  <\u002Fscript>\n\n  <!-- ═══ COVER ANIMATION ══════════════════════════════════════════════════ -->\n  <script>\n  (function() {\n    // Lock scroll while cover is active\n    document.body.classList.add('cover-active');\n\n    const overlay = document.getElementById('cover-overlay');\n    const cvCanvas = document.getElementById('cv-canvas');\n    const ctx = cvCanvas.getContext('2d');\n    let W, H;\n    function resize() { W = cvCanvas.width = innerWidth; H = cvCanvas.height = innerHeight; }\n    resize(); addEventListener('resize', resize);\n\n    // ── Phase timing ───────────────────────────────────────────────────────\n    // boot → scatter (free drift) → cohere (KOH rises to 0.998, then Juna arrives → drops to 0.21)\n    // → klick (Protocol activates) → emerge (title breaks through) → ready\n    const PHASES = { boot:[0,2.5], scatter:[2.5,5.5], cohere:[5.5,11], klick:[11,12], emerge:[12,17], ready:[17,Infinity] };\n    const cvStart = Date.now();\n    function cvNow() { return (Date.now() - cvStart) / 1000; }\n    function getPhase() {\n      const t = cvNow();\n      for (const [name,[s,e]] of Object.entries(PHASES)) {\n        if (t >= s && t < e) return { name, p: Math.min(1,(t-s)/(e===Infinity?1:e-s)), t };\n      }\n      return { name:'ready', p:1, t: cvNow() };\n    }\n\n    // ── KOH arc ────────────────────────────────────────────────────────────\n    // Rises 0→0.998 during early cohere, then Juna's arrival drops it to 0.21,\n    // Klick = Protocol fires at 0.21, Emerge = recovery 0.21→0.998\n    function getKOH(name, p, t) {\n      if (name==='boot' || name==='scatter') return 0;\n      if (name==='cohere') {\n        if (p < 0.52) return Math.min(0.998, p/0.52 * 0.998); // rises to nominal\n        return 0.998 - (p-0.52)/0.48 * 0.788;                 // Juna arrives → drops\n      }\n      if (name==='klick') return 0.21 + Math.sin(p*Math.PI)*0.04;\n      if (name==='emerge') return 0.21 + p * 0.788;\n      // ready: nominal with micro-residual flicker\n      return 0.998 - Math.abs(Math.sin(t*0.28)*0.012);\n    }\n\n    // ── Line style = KOH state ─────────────────────────────────────────────\n    function lineStyle(koh) {\n      if (koh > 0.85) return { col:'#3B6FA0', a:0.22, amp:6,  noise:0,   w:0.7 }; // calm blue\n      if (koh > 0.65) return { col:'#FFD700', a:0.32, amp:18, noise:1.5, w:0.8 }; // alert yellow\n      if (koh > 0.40) return { col:'#FFD700', a:0.50, amp:36, noise:6,   w:1.0 }; // stressed\n      if (koh > 0.22) return { col:'#FF4500', a:0.65, amp:58, noise:16,  w:1.2 }; // critical\n      return             { col:'#FF4500', a:0.80, amp:70, noise:28,  w:1.5 }; // crisis\n    }\n\n    // ── Story-meaningful clusters ──────────────────────────────────────────\n    // 8 clusters matching alter identities from the novel\n    const CL = [\n      // name, color, relX, relY, spread, count\n      ['fragment', '#e8e6df', 0.50, 0.50, 0.30, 22], // center void — the first fragment\n      ['aegis',    '#4a7fb5', 0.20, 0.28, 0.13, 18], // system blue — control architecture\n      ['nyx',      '#FF4500', 0.76, 0.68, 0.11, 14], // flame orange — fight response\n      ['kiko',     '#a8c0d8', 0.18, 0.72, 0.09, 12], // frostbite — freeze/small\n      ['rhys',     '#f0a878', 0.78, 0.24, 0.13, 16], // amber — warmth/connection\n      ['silas',    '#FFDF00', 0.58, 0.18, 0.10, 14], // kintsugi gold — echo/resonance\n      ['moros',    '#8a87a8', 0.24, 0.58, 0.10, 14], // purple-grey — collapse/sinking\n      ['lex',      '#00FF9F', 0.70, 0.42, 0.09, 12], // terminal green — logic/analysis\n    ];\n\n    // Build particles within clusters\n    const P = [];\n    CL.forEach(([name, col, rx, ry, spread, n], ci) => {\n      for (let j = 0; j < n; j++) {\n        const la = Math.random()*Math.PI*2;\n        const lr = 20 + Math.random() * Math.min(innerWidth,innerHeight) * spread;\n        // Start position: scattered far from home\n        const sa = Math.random()*Math.PI*2;\n        const sd = 100 + Math.random() * Math.max(innerWidth,innerHeight) * 0.46;\n        P.push({\n          x: innerWidth/2 + Math.cos(sa)*sd,\n          y: innerHeight/2 + Math.sin(sa)*sd,\n          vx: (Math.random()-.5)*.45, vy: (Math.random()-.5)*.45,\n          r: 0.9 + Math.random()*2.0,\n          col, ci,\n          // Home cluster position\n          hx: rx, hy: ry,\n          // Local orbit within cluster\n          la, lr,\n          os: (2e-4+Math.random()*9e-4)*(Math.random()<.5?1:-1),\n          op: 0.32 + Math.random()*0.58,\n          alive: true, escaped: false,\n          flickerPhase: Math.random()*Math.PI*2,\n        });\n      }\n    });\n\n    // ── DOM refs ───────────────────────────────────────────────────────────\n    const bootEl  = document.getElementById('cv-boot');\n    const twrap   = document.getElementById('cv-title-wrap');\n    const kohDiv  = document.getElementById('cv-koh');\n    const kohVal  = document.getElementById('cv-kohval');\n    const barFill = document.getElementById('cv-bar');\n    const chapEl  = document.getElementById('cv-chap');\n    const beginEl = document.getElementById('cv-begin');\n    const chrR    = document.getElementById('cv-chr-r');\n    const chrG    = document.getElementById('cv-chr-g');\n\n    // ── Boot text ──────────────────────────────────────────────────────────\n    const BOOT_LINES = [\n      'KOHÄRENZ-PROTOKOLL · v0.2 · BOOT SEQUENCE INIT','',\n      'VAKUUM-SUBSTRAT     aktiv','NICHTS-RAUSCHEN     indexiert',\n      'ANTEILE             11 · registriert','RESIDUAL-ECHOS      persistenz-score 0.41',\n      '','SWEEP               bereit','KOHÄRENZ-INDEX      → berechnung läuft…'\n    ];\n    function drawBoot(p) {\n      const n = Math.floor(p*BOOT_LINES.length*1.3);\n      bootEl.textContent = BOOT_LINES.slice(0,Math.min(n,BOOT_LINES.length)).join('\\n');\n      bootEl.style.opacity = Math.min(1,p*6).toFixed(2);\n    }\n\n    // ── Ghost fragments (cover-scope only) ────────────────────────────────\n    const SYMS=[\n      {c:'◈ · ·',col:'#a8c0d8'},{c:'⤬ ⤬',col:'#d4a0c8'},\n      {c:'▮▮▮',col:'#FF4500'},{c:'◌ ✦ ◌',col:'#FFDF00'},\n      {c:'/ / /',col:'#4a7fb5'},{c:'▼ ▼',col:'#8a87a8'},\n      {c:'↯',col:'#FF4500'},{c:'◆ ◆',col:'#FFDF00'},\n      {c:'≡ ≡',col:'#a8c0d8'},{c:'· · ·',col:'#00FF9F'},\n    ];\n    let ghostInterval=null, coverActive=true;\n    function spawnGhost(intense) {\n      if (!coverActive) return;\n      const sig=SYMS[Math.floor(Math.random()*SYMS.length)];\n      const el=document.createElement('div');\n      el.className='cv-ghost'+(Math.random()<.3?' go long':' go');\n      el.textContent=sig.c; el.style.color=sig.col;\n      const side=Math.random();\n      if(side<.25){el.style.left=(Math.random()*14)+'vw';el.style.top=(10+Math.random()*80)+'vh';}\n      else if(side<.5){el.style.right=(Math.random()*14)+'vw';el.style.top=(10+Math.random()*80)+'vh';}\n      else{el.style.left=(10+Math.random()*80)+'vw';el.style.top=(5+Math.random()*90)+'vh';}\n      el.style.fontSize=(10+Math.random()*(intense?10:4))+'px';\n      overlay.appendChild(el);\n      setTimeout(()=>el.remove(),2000);\n    }\n    function startGhosts(ms,intense){clearInterval(ghostInterval);ghostInterval=setInterval(()=>spawnGhost(intense),ms);}\n\n    let klickDone=false, readyDone=false;\n\n    // ── Main draw loop ─────────────────────────────────────────────────────\n    function cvDraw() {\n      requestAnimationFrame(cvDraw);\n      const {name,p,t}=getPhase();\n      const cx=W/2, cy=H/2;\n      const koh = getKOH(name,p,t);\n      const ls  = lineStyle(koh);\n\n      ctx.clearRect(0,0,W,H);\n\n      // Background glow — intensity tracks disturbance (1-koh)\n      const disturbance = 1 - Math.max(0, koh);\n      const ga = 0.015 + disturbance * 0.08;\n      const glowCol = koh > 0.5 ? `rgba(252,238,12,${ga})` : `rgba(255,69,0,${ga})`;\n      const grd=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.min(W,H)*0.5);\n      grd.addColorStop(0,glowCol);\n      grd.addColorStop(0.5,`rgba(74,127,181,${ga*0.2})`);\n      grd.addColorStop(1,'rgba(11,13,23,0)');\n      ctx.fillStyle=grd; ctx.fillRect(0,0,W,H);\n\n      // Vignette\n      const vig=ctx.createRadialGradient(cx,cy,Math.min(W,H)*.3,cx,cy,Math.min(W,H)*.72);\n      vig.addColorStop(0,'rgba(11,13,23,0)'); vig.addColorStop(1,'rgba(11,13,23,0.6)');\n      ctx.fillStyle=vig; ctx.fillRect(0,0,W,H);\n\n      // ── Particles ────────────────────────────────────────────────────────\n      P.forEach((q,i) => {\n        if (!q.alive) return;\n\n        // Target cluster home (world coords)\n        const thx = q.hx * W, thy = q.hy * H;\n\n        if (name==='boot' || name==='scatter') {\n          q.x+=q.vx; q.y+=q.vy;\n          if(q.x<0)q.x=W; if(q.x>W)q.x=0; if(q.y<0)q.y=H; if(q.y>H)q.y=0;\n\n        } else if (name==='cohere') {\n          // Drift toward cluster home, then orbit within it\n          q.la += q.os * 800 * (1/60);\n          const clumpPull = Math.min(1, p * 1.8);\n          const targetX = thx + Math.cos(q.la) * q.lr;\n          const targetY = thy + Math.sin(q.la) * q.lr;\n          q.x += (targetX - q.x) * 0.018 * clumpPull + q.vx * (1-clumpPull);\n          q.y += (targetY - q.y) * 0.018 * clumpPull + q.vy * (1-clumpPull);\n\n          // Perturbation: if KOH dropping, add turbulence\n          if (p > 0.52) {\n            const turb = (p-0.52)/0.48;\n            q.x += (Math.random()-.5) * turb * 3;\n            q.y += (Math.random()-.5) * turb * 3;\n          }\n\n        } else if (name==='klick') {\n          // Violent scatter from protocol activation\n          const burst = Math.sin(p*Math.PI) * 4;\n          const angle = Math.atan2(q.y-cy, q.x-cx);\n          q.x += Math.cos(angle)*burst + (Math.random()-.5)*2;\n          q.y += Math.sin(angle)*burst + (Math.random()-.5)*2;\n\n        } else if (name==='emerge') {\n          // Outer cluster fragments get swept away by the protocol\n          if (i < P.length * 0.30 && !q.escaped) {\n            q.x += Math.cos(q.la)*1.5; q.y += Math.sin(q.la)*1.5;\n            q.op -= 0.003;\n            if (q.op <= 0) { q.alive=false; return; }\n            q.escaped = true;\n          } else {\n            // Survivors re-form around clusters, now in recovery\n            q.la += q.os * 500 * (1/60);\n            const recoverR = q.lr * (0.25 + p*0.15);\n            const tx = thx + Math.cos(q.la)*recoverR;\n            const ty = thy + Math.sin(q.la)*recoverR;\n            q.x += (tx-q.x)*0.020; q.y += (ty-q.y)*0.020;\n          }\n\n        } else { // ready\n          q.la += q.os * 350 * (1/60);\n          // Gentle breathing orbit\n          const breathe = 1 + Math.sin(t*0.4 + q.flickerPhase)*0.06;\n          const rr = q.lr * 0.28 * breathe;\n          q.x += (thx+Math.cos(q.la)*rr-q.x)*0.014;\n          q.y += (thy+Math.sin(q.la)*rr-q.y)*0.014;\n        }\n\n        // Opacity flicker — subtle, tied to KOH disturbance\n        const flicker = 1 - Math.max(0,(1-koh)*0.4)*Math.abs(Math.sin(t*3+q.flickerPhase));\n        const alpha = q.op * flicker * (name==='boot'?Math.min(1,t*0.5):1);\n\n        // Draw particle\n        ctx.beginPath();\n        ctx.arc(q.x, q.y, q.r, 0, Math.PI*2);\n        const hex = Math.max(0,Math.min(255,Math.floor(alpha*255))).toString(16).padStart(2,'0');\n        ctx.fillStyle = q.col + hex;\n        ctx.fill();\n\n        // Connection lines within cluster — more visible when KOH high\n        if (name !== 'boot' && name !== 'scatter') {\n          const maxD = 55 + koh * 35;\n          const lineA = koh * 0.12;\n          if (lineA > 0.01) {\n            for (let j=i+1; j<Math.min(i+6,P.length); j++) {\n              const b=P[j]; if(!b.alive||b.ci!==q.ci) continue;\n              const d=Math.hypot(q.x-b.x,q.y-b.y);\n              if(d<maxD){\n                const a=(1-d/maxD)*lineA;\n                ctx.beginPath(); ctx.moveTo(q.x,q.y); ctx.lineTo(b.x,b.y);\n                ctx.strokeStyle=`rgba(232,230,223,${a.toFixed(3)})`; ctx.lineWidth=0.5; ctx.stroke();\n              }\n            }\n          }\n        }\n      });\n\n      // ── Waveform — style tracks KOH ───────────────────────────────────────\n      if (name !== 'boot') {\n        const wY = cy + H*0.26;\n        const fA = name==='scatter' ? p*0.15 : name==='ready' ? ls.a*0.7 : ls.a;\n\n        // Main wave\n        ctx.beginPath();\n        for (let x=0; x<=W; x+=2) {\n          const noise = ls.noise > 0 ? (Math.random()-.5)*ls.noise : 0;\n          const y = wY + Math.sin((x/W*6 + t*1.2)*Math.PI*2)*ls.amp + noise;\n          x===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);\n        }\n        ctx.strokeStyle=ls.col; ctx.lineWidth=ls.w; ctx.globalAlpha=fA; ctx.stroke();\n\n        // Harmonic echo\n        ctx.beginPath();\n        for (let x=0; x<=W; x+=3) {\n          const y = wY + Math.sin((x/W*13+t*2.3)*Math.PI*2)*ls.amp*0.3;\n          x===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);\n        }\n        ctx.lineWidth=ls.w*0.4; ctx.globalAlpha=fA*0.35; ctx.stroke();\n\n        // Crisis: extra jagged harmonic\n        if (koh < 0.4) {\n          ctx.beginPath();\n          for (let x=0; x<=W; x+=2) {\n            const noise2 = (Math.random()-.5)*ls.noise*0.7;\n            const y = wY - ls.amp*0.5 + Math.sin((x/W*20+t*3.8)*Math.PI*2)*ls.amp*0.4 + noise2;\n            x===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);\n          }\n          ctx.strokeStyle='#FF4500'; ctx.lineWidth=0.5; ctx.globalAlpha=fA*0.5; ctx.stroke();\n        }\n        ctx.globalAlpha=1;\n      }\n\n      // ── Klick flash ────────────────────────────────────────────────────────\n      if (name==='klick') {\n        const fA=Math.sin(p*Math.PI)*0.12;\n        ctx.fillStyle=`rgba(252,238,12,${fA})`; ctx.fillRect(0,0,W,H);\n        // Chromatic bands\n        if (Math.random()<0.4) {\n          ctx.fillStyle=`rgba(255,69,0,${fA*0.5})`;\n          for(let i=0;i<3;i++){const bY=Math.random()*H;ctx.fillRect(0,bY,W,1+Math.random()*3);}\n        }\n      }\n\n      // Residual tremor at t≈20s\n      if(t>20&&t<20.7&&name==='ready'){\n        const gA=Math.sin((t-20)/.7*Math.PI)*.04;\n        ctx.fillStyle=`rgba(255,69,0,${gA})`; ctx.fillRect(0,0,W,H);\n      }\n\n      // ── Phase-driven UI ───────────────────────────────────────────────────\n      if (name==='boot') drawBoot(p);\n      if (name==='scatter') bootEl.style.opacity=Math.max(0,1-p*4).toFixed(2);\n      if (name!=='boot'&&name!=='scatter') bootEl.style.opacity='0';\n\n      if (name==='cohere'||name==='klick'||name==='emerge'||name==='ready') {\n        // KOH meter visible\n        kohDiv.style.opacity = Math.min(1, name==='cohere'?p*5:1).toFixed(2);\n        const displayKOH = Math.max(0, koh);\n        kohVal.textContent = displayKOH.toFixed(3);\n        barFill.style.width = (displayKOH * 100).toFixed(1)+'%';\n        // Bar color = KOH state\n        barFill.style.background = koh > 0.5 ? '#FFD700' : '#FF4500';\n        barFill.style.boxShadow = koh > 0.5 ? '0 0 10px #FFD700' : '0 0 10px #FF4500';\n        // Ghosts start when KOH is in disturbance\n        if (name==='cohere'&&p>0.55&&!ghostInterval) startGhosts(900,false);\n        if (name==='klick'&&!klickDone) { klickDone=true; startGhosts(400,true); }\n      }\n\n      if (name==='emerge') {\n        // Title emerges through the chaos — with gentle chromatic flutter\n        const tA = Math.min(1, p*1.4);\n        twrap.style.opacity = tA.toFixed(3);\n        const blur = (1-Math.min(1,p*1.5))*14;\n        twrap.style.filter = `blur(${blur.toFixed(1)}px)`;\n        // Chromatic aberration fades as title settles\n        const ca=Math.max(0,1-p*2.2), sh=(1-p*1.5)*7;\n        chrR.style.opacity=ca.toFixed(3); chrR.style.transform=`translate(-${sh}px,0)`;\n        chrG.style.opacity=ca.toFixed(3); chrG.style.transform=`translate(${sh}px,0)`;\n        chapEl.style.opacity=Math.max(0,(p-.55)*2.5).toFixed(3);\n        if (p>0.7) { clearInterval(ghostInterval); ghostInterval=null; }\n      }\n\n      if (name==='ready'&&!readyDone) {\n        readyDone=true;\n        twrap.style.opacity='1'; twrap.style.filter='blur(0)';\n        chrR.style.opacity='0'; chrG.style.opacity='0';\n        chapEl.style.opacity='1'; kohDiv.style.opacity='1';\n        twrap.classList.add('breathe');\n        // Occasional gentle title flicker (not extreme)\n        setInterval(() => {\n          const k = getPhase();\n          if (k.name!=='ready'||!coverActive) return;\n          chrR.style.opacity='0.12'; chrR.style.transform='translate(-2px,0)';\n          chrG.style.opacity='0.10'; chrG.style.transform='translate(2px,0)';\n          setTimeout(()=>{\n            chrR.style.opacity='0.06'; setTimeout(()=>{chrR.style.opacity='0';chrG.style.opacity='0';},120);\n          },80);\n        }, 4500 + Math.random()*3000);\n        clearInterval(ghostInterval); ghostInterval=null;\n        // Fade in begin button\n        let bO=0;\n        const bFd=setInterval(()=>{\n          bO=Math.min(1,bO+.022); beginEl.style.opacity=bO.toFixed(2);\n          if(bO>=1){beginEl.classList.add('live');clearInterval(bFd);}\n        },40);\n      }\n    }\n    cvDraw();\n\n    // ── Kintsugi reveal animation ─────────────────────────────────────────\n    function generateCracks(ox, oy, count) {\n      const cracks = [];\n      for (let i=0; i<count; i++) {\n        const baseAngle = (i/count)*Math.PI*2 + (Math.random()-.5)*0.5;\n        const pts = [{x:ox,y:oy}];\n        let cx=ox, cy=oy;\n        const steps = 7 + Math.floor(Math.random()*9);\n        const reach = 90 + Math.random()*Math.max(W,H)*0.45;\n        const stepLen = reach/steps;\n        for (let s=0; s<steps; s++) {\n          const dev = (Math.random()-.5)*0.55;\n          const a = baseAngle + dev;\n          cx += Math.cos(a)*stepLen; cy += Math.sin(a)*stepLen;\n          pts.push({x:cx,y:cy});\n          // Branch\n          if (Math.random()<0.45) {\n            const ba = a + (Math.random()-.5)*1.4;\n            const bl = stepLen*(0.5+Math.random()*0.8);\n            cracks.push({ points:[{x:cx,y:cy},{x:cx+Math.cos(ba)*bl,y:cy+Math.sin(ba)*bl}], w:0.4+Math.random()*0.6 });\n          }\n        }\n        cracks.push({ points:pts, w:0.8+Math.random()*1.4 });\n      }\n      return cracks;\n    }\n\n    beginEl.addEventListener('click', () => {\n      if (!beginEl.classList.contains('live')) return;\n      coverActive = false;\n      clearInterval(ghostInterval);\n      beginEl.style.pointerEvents = 'none';\n\n      // ── Step 1: Freeze canvas into an img so clones show the right frame ──\n      const frozenImg = new Image();\n      frozenImg.src = cvCanvas.toDataURL('image/png');\n      frozenImg.style.cssText = `position:absolute;inset:0;width:${W}px;height:${H}px;z-index:0;pointer-events:none;`;\n      overlay.insertBefore(frozenImg, cvCanvas);\n      cvCanvas.style.opacity = '0';\n\n      // ── Step 2: Generate shard boundary lines (radiating from center) ────\n      const CX = W/2, CY = H/2;\n      const SHARD_N = 14;\n      const lines = [];\n      for (let i = 0; i < SHARD_N; i++) {\n        const baseAngle = (i / SHARD_N) * Math.PI * 2 + (Math.random() - 0.5) * 0.32;\n        const pts = [{x: CX, y: CY}];\n        let ax = CX, ay = CY;\n        const steps = 4 + Math.floor(Math.random() * 5);\n        const reach = Math.max(W, H) * 0.9;\n        for (let s = 0; s < steps; s++) {\n          const dev = (Math.random() - 0.5) * 0.44;\n          ax += Math.cos(baseAngle + dev) * reach / steps;\n          ay += Math.sin(baseAngle + dev) * reach / steps;\n          pts.push({x: ax, y: ay});\n        }\n        // Extend last segment far beyond screen\n        const last = pts[pts.length-1], prev = pts[pts.length-2];\n        const dx = last.x - prev.x, dy = last.y - prev.y;\n        const len = Math.hypot(dx, dy) || 1;\n        pts.push({x: last.x + dx/len*Math.max(W,H)*1.8, y: last.y + dy/len*Math.max(W,H)*1.8});\n        lines.push(pts);\n      }\n\n      // Sort by angle so polygons are contiguous\n      lines.sort((a, b) => {\n        const ea = a[a.length-1], eb = b[b.length-1];\n        return Math.atan2(ea.y-CY, ea.x-CX) - Math.atan2(eb.y-CY, eb.x-CX);\n      });\n\n      // ── Step 3: Compute shard polygons + outward vectors ─────────────────\n      const shards = lines.map((line, i) => {\n        const next = lines[(i+1) % lines.length];\n        const poly = [{x:CX, y:CY}, ...line.slice(1), ...next.slice(1).reverse()];\n        // Outward direction: bisector of two line angles\n        const a1 = Math.atan2(line[Math.min(2,line.length-1)].y-CY, line[Math.min(2,line.length-1)].x-CX);\n        const a2 = Math.atan2(next[Math.min(2,next.length-1)].y-CY, next[Math.min(2,next.length-1)].x-CX);\n        // Handle angle wrap-around\n        let mid = a1 + (((a2-a1+Math.PI*3)%(Math.PI*2))-Math.PI)*0.5;\n        const dist = 110 + Math.random() * 220;\n        return {\n          poly,\n          tx: Math.cos(mid) * dist,\n          ty: Math.sin(mid) * dist + 40, // slight gravity\n          rot: (Math.random()-0.5) * 30,\n          delay: i * 22 + Math.random() * 50,\n          dur: 550 + Math.random() * 280,\n        };\n      });\n\n      // ── Step 4: Animate crack lines growing ──────────────────────────────\n      const crackCv = document.createElement('canvas');\n      crackCv.width = W; crackCv.height = H;\n      crackCv.style.cssText = 'position:fixed;inset:0;z-index:600;pointer-events:none;';\n      document.body.appendChild(crackCv);\n      const cc = crackCv.getContext('2d');\n      const crackStart = Date.now();\n\n      function animCracks() {\n        const prog = Math.min(1, (Date.now()-crackStart)/750);\n        cc.clearRect(0,0,W,H);\n        lines.forEach(line => {\n          const upto = Math.max(2, Math.ceil(prog*line.length));\n          // Dark void split\n          cc.beginPath(); cc.moveTo(line[0].x, line[0].y);\n          for (let i=1;i<upto;i++) cc.lineTo(line[i].x, line[i].y);\n          cc.strokeStyle='rgba(0,0,0,0.9)'; cc.lineWidth=6; cc.lineCap='round'; cc.stroke();\n          // Kintsugi gold glow\n          cc.beginPath(); cc.moveTo(line[0].x, line[0].y);\n          for (let i=1;i<upto;i++) cc.lineTo(line[i].x, line[i].y);\n          cc.strokeStyle='#FFDF00'; cc.lineWidth=1.2;\n          cc.shadowColor='#FFDF00'; cc.shadowBlur=14;\n          cc.globalAlpha=0.92; cc.stroke();\n          cc.globalAlpha=1; cc.shadowBlur=0;\n        });\n        if (prog < 1) requestAnimationFrame(animCracks);\n        else setTimeout(doShatter, 120);\n      }\n      requestAnimationFrame(animCracks);\n\n      // ── Step 5: Shatter — clone + fly outward ────────────────────────────\n      function doShatter() {\n        shards.forEach(shard => {\n          const clone = overlay.cloneNode(true);\n          clone.id = '';\n          // Explicitly set ALL needed styles (id stripped → CSS selector gone)\n          clone.style.position = 'fixed';\n          clone.style.inset = '0';\n          clone.style.zIndex = '510';\n          clone.style.opacity = '1';\n          clone.style.background = '#0B0D17';\n          clone.style.transition = 'none';\n          clone.style.transform = 'none';\n          clone.style.willChange = 'transform, opacity';\n          clone.style.clipPath = 'polygon(' + shard.poly.map(p =>\n            `${p.x.toFixed(1)}px ${p.y.toFixed(1)}px`).join(',') + ')';\n          const cloneCanvas = clone.querySelector('#cv-canvas');\n          if (cloneCanvas) cloneCanvas.style.opacity = '0';\n          document.body.appendChild(clone);\n\n          // Force synchronous layout reflow → browser locks in initial state\n          clone.getBoundingClientRect();\n\n          // Now start the transition — shard flies outward\n          clone.style.transition = [\n            `transform ${shard.dur}ms ${shard.delay}ms cubic-bezier(0.2,0,0.8,0.4)`,\n            `opacity 300ms ${Math.floor(shard.delay + shard.dur * 0.5)}ms ease-out`\n          ].join(', ');\n          clone.style.transform = `translate(${shard.tx.toFixed(1)}px,${shard.ty.toFixed(1)}px) rotate(${shard.rot.toFixed(1)}deg)`;\n          clone.style.opacity = '0';\n\n          setTimeout(() => clone.remove(), shard.delay + shard.dur + 500);\n        });\n\n        const maxDelay = Math.max(...shards.map(s => s.delay + s.dur));\n        setTimeout(() => {\n          crackCv.style.transition = 'opacity 400ms ease';\n          crackCv.style.opacity = '0';\n          overlay.style.display = 'none';\n          document.body.classList.remove('cover-active');\n          window.scrollTo(0, 0);\n          setTimeout(() => crackCv.remove(), 450);\n        }, maxDelay + 50);\n      }\n    });\n  })();\n  <\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
