document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"de\"><head>\n<meta charset=\"UTF-8\">\n<title>Kapitel 0 — Maximal Edition · ASDLS<\u002Ftitle>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<link href=\"https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&amp;family=JetBrains+Mono:wght@300;400;500;700&amp;family=Inter:wght@200;300;400;500;600;700&amp;family=Space+Grotesk:wght@300;400;500;700&amp;display=swap\" rel=\"stylesheet\">\n<style id=\"kp-vars\">\n  :root {\n    /* ASDLS palette */\n    --terminal-black: #0B0D17;\n    --charcoal: #1A1D24;\n    --bg: #0B0D17;\n    --bg-alt: #14161f;\n    --ink: #e8e6df;\n    --ink-soft: #a8a397;\n    --ink-mute: #5a554a;\n    --rule: #1f222b;\n\n    /* ASDLS state colors */\n    --system-blue: #003366;\n    --system-blue-glow: #4a7fb5;\n    --corrupted: #8B8B00;\n    --signal: #FFD700;\n    --terminal-green: #00FF9F;\n    --flame: #FF4500;\n    --clean-ping: #FCEE0C;\n    --latency: #3B3355;\n    --kintsugi: #FFDF00;\n\n    --measure: 38rem;\n    --fs-body: 18px;\n    --leading: 1.7;\n\n    --serif: 'Cormorant Garamond', Georgia, serif;\n    --mono: 'JetBrains Mono', ui-monospace, monospace;\n    --display: 'Space Grotesk', system-ui, sans-serif;\n    --sans: 'Inter', system-ui, sans-serif;\n  }\n<\u002Fstyle>\n<style>\n  html, body { margin: 0; padding: 0; }\n  body.cover-active { overflow: hidden; }\n  body {\n    background: var(--bg);\n    color: var(--ink);\n    font-family: var(--serif);\n    font-size: var(--fs-body);\n    line-height: var(--leading);\n    -webkit-font-smoothing: antialiased;\n    text-rendering: optimizeLegibility;\n    overflow-x: hidden;\n  }\n\n  /* Background grid — Interface Brutalism */\n  body::before {\n    content: '';\n    position: fixed; inset: 0;\n    background-image:\n      linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),\n      linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);\n    background-size: 80px 80px;\n    pointer-events: none;\n    z-index: 0;\n    mask-image: radial-gradient(ellipse at center, black 0%, transparent 80%);\n  }\n\n  /* Top chrome — terminal HUD style */\n  .topbar {\n    position: sticky; top: 0;\n    background: rgba(11, 13, 23, 0.95);\n    backdrop-filter: blur(12px);\n    border-bottom: 1px solid var(--rule);\n    padding: 12px 36px;\n    display: grid;\n    grid-template-columns: 1fr 1fr 1fr;\n    align-items: center;\n    z-index: 100;\n    font-family: var(--mono);\n    font-size: 10.5px;\n    letter-spacing: 0.18em;\n    text-transform: uppercase;\n    color: var(--ink-mute);\n  }\n  .topbar a { color: inherit; text-decoration: none; }\n  .topbar a:hover { color: var(--signal); }\n  .topbar .center { text-align: center; color: var(--ink-soft); display: flex; align-items: center; justify-content: center; gap: 10px; }\n  .topbar .center::before {\n    content: '';\n    width: 8px; height: 8px;\n    background: var(--clean-ping);\n    border-radius: 50%;\n    box-shadow: 0 0 8px var(--clean-ping);\n    animation: pulse 2s infinite ease-in-out;\n  }\n  @keyframes pulse {\n    0%, 100% { opacity: 0.4; }\n    50% { opacity: 1; }\n  }\n  .topbar .right { text-align: right; }\n\n  /* HUD overlay */\n  .hud {\n    position: fixed;\n    top: 64px;\n    right: 24px;\n    z-index: 90;\n    font-family: var(--mono);\n    font-size: 9px;\n    color: var(--ink-mute);\n    text-transform: uppercase;\n    letter-spacing: 0.2em;\n    text-align: right;\n    line-height: 1.7;\n    pointer-events: none;\n  }\n  .hud .row { display: flex; justify-content: flex-end; gap: 1em; }\n  .hud .k { color: var(--ink-mute); }\n  .hud .v { color: var(--signal); }\n  .hud .bar {\n    display: inline-block;\n    width: 80px;\n    height: 4px;\n    background: rgba(255,215,0,0.15);\n    margin-left: 8px;\n    position: relative;\n    vertical-align: middle;\n  }\n  .hud .bar::after {\n    content: '';\n    position: absolute;\n    top: 0; left: 0;\n    height: 100%;\n    background: var(--signal);\n    width: var(--w, 99%);\n  }\n\n  /* Reading progress */\n  .progress {\n    position: fixed; top: 0; left: 0;\n    height: 2px;\n    background: linear-gradient(90deg, var(--signal), var(--clean-ping));\n    width: 0%;\n    z-index: 200;\n    box-shadow: 0 0 12px var(--signal);\n  }\n\n  /* Main layout — 3 columns: gutter | content | margin */\n  main {\n    max-width: 1280px;\n    margin: 0 auto;\n    padding: 0 24px;\n    position: relative;\n    z-index: 1;\n  }\n\n  /* Cover */\n  .cover {\n    min-height: 100vh;\n    display: grid;\n    grid-template-rows: auto 1fr auto;\n    padding: 12vh 0 8vh;\n    position: relative;\n  }\n  .cover::after {\n    content: '';\n    position: absolute;\n    inset: 8vh 0 4vh;\n    border: 1px solid var(--rule);\n    border-left: 2px solid var(--signal);\n    pointer-events: none;\n    z-index: -1;\n  }\n\n  .cover .head-row {\n    display: flex;\n    justify-content: space-between;\n    align-items: flex-start;\n    padding: 0 36px;\n  }\n  .cover .stamp {\n    font-family: var(--mono);\n    font-size: 10px;\n    letter-spacing: 0.3em;\n    text-transform: uppercase;\n    color: var(--ink-mute);\n  }\n  .cover .stamp .hot { color: var(--clean-ping); }\n  .cover .stamp .corrupt { color: var(--corrupted); }\n\n  .cover .body-zone {\n    display: grid;\n    grid-template-columns: 1fr;\n    align-content: center;\n    padding: 0 36px;\n  }\n\n  .cover h1 {\n    font-family: var(--display);\n    font-weight: 300;\n    font-size: clamp(3rem, 9vw, 8rem);\n    line-height: 0.95;\n    letter-spacing: -0.025em;\n    margin: 0;\n    color: var(--ink);\n    position: relative;\n  }\n  .cover h1 .glitch {\n    position: relative;\n    display: inline-block;\n  }\n  .cover h1 .glitch::before, .cover h1 .glitch::after {\n    content: attr(data-text);\n    position: absolute;\n    top: 0; left: 0;\n    width: 100%;\n    overflow: hidden;\n  }\n  .cover h1 .glitch::before {\n    color: var(--flame);\n    transform: translate(-2px, 0);\n    clip-path: polygon(0 20%, 100% 20%, 100% 35%, 0 35%);\n    animation: glitch-a 4s infinite linear alternate-reverse;\n  }\n  .cover h1 .glitch::after {\n    color: var(--terminal-green);\n    transform: translate(2px, 0);\n    clip-path: polygon(0 60%, 100% 60%, 100% 75%, 0 75%);\n    animation: glitch-b 6s infinite linear alternate-reverse;\n  }\n  @keyframes glitch-a {\n    0%, 92%, 100% { transform: translate(-2px, 0); }\n    93% { transform: translate(-12px, 1px); }\n    95% { transform: translate(-2px, 0); }\n    97% { transform: translate(8px, -2px); }\n  }\n  @keyframes glitch-b {\n    0%, 91%, 100% { transform: translate(2px, 0); }\n    92% { transform: translate(12px, -1px); }\n    94% { transform: translate(2px, 0); }\n    96% { transform: translate(-8px, 2px); }\n  }\n\n  .cover h1 .it {\n    font-style: italic;\n    font-family: var(--serif);\n    font-weight: 400;\n    color: var(--clean-ping);\n  }\n\n  .cover .subhead {\n    margin-top: 2.5em;\n    font-family: var(--serif);\n    font-style: italic;\n    font-size: clamp(1.2rem, 2.4vw, 1.7rem);\n    color: var(--ink-soft);\n    max-width: 30em;\n    line-height: 1.4;\n    text-wrap: pretty;\n  }\n\n  .cover .foot-row {\n    display: grid;\n    grid-template-columns: repeat(4, 1fr);\n    gap: 1em;\n    padding: 0 36px;\n    font-family: var(--mono);\n    font-size: 10px;\n    letter-spacing: 0.18em;\n    color: var(--ink-mute);\n    text-transform: uppercase;\n    border-top: 1px solid var(--rule);\n    padding-top: 18px;\n  }\n  .cover .foot-row .k { display: block; color: var(--ink-mute); margin-bottom: 4px; font-size: 9px; }\n  .cover .foot-row .v { color: var(--ink); font-size: 11px; }\n  .cover .foot-row .v.warn { color: var(--signal); }\n  .cover .foot-row .v.crit { color: var(--flame); }\n\n  /* Content layout — 3 column grid */\n  .text-layout {\n    display: grid;\n    grid-template-columns: minmax(180px, 1fr) minmax(0, var(--measure)) minmax(180px, 1fr);\n    gap: 1.5em;\n    padding: 6vh 0 12vh;\n  }\n  .text-col {\n    grid-column: 2;\n    position: relative;\n  }\n  .margin-left {\n    grid-column: 1;\n    position: relative;\n  }\n  .margin-right {\n    grid-column: 3;\n    position: relative;\n  }\n\n  /* Section heading */\n  .section {\n    margin-bottom: 0;\n    position: relative;\n  }\n  .section + .section { margin-top: 8em; }\n  .section-marker {\n    display: grid;\n    grid-template-columns: 50px 1fr;\n    grid-template-rows: auto auto;\n    gap: 0.4em 1em;\n    align-items: start;\n    padding-bottom: 1em;\n    border-bottom: 1px solid var(--rule);\n    margin: 0 0 2.5em;\n    position: relative;\n  }\n  .section-marker .num {\n    font-family: var(--mono);\n    font-size: 11px;\n    letter-spacing: 0.2em;\n    color: var(--signal);\n    text-transform: uppercase;\n    padding-top: 0.3em;\n    grid-row: 1;\n    grid-column: 1;\n  }\n  .section-marker h2 {\n    font-family: var(--display);\n    font-weight: 400;\n    font-size: clamp(1.2rem, 4vw, 2.2rem);\n    color: var(--ink);\n    margin: 0;\n    letter-spacing: -0.01em;\n    line-height: 1.1;\n    grid-row: 1;\n    grid-column: 2;\n    text-wrap: balance;\n  }\n  .section-marker .tier {\n    font-family: var(--mono);\n    font-size: 9px;\n    letter-spacing: 0.18em;\n    text-transform: uppercase;\n    color: var(--ink-mute);\n    grid-row: 2;\n    grid-column: 2;\n  }\n  .section-marker .tier .dot {\n    display: inline-block;\n    width: 6px; height: 6px;\n    border-radius: 50%;\n    margin-right: 6px;\n    transform: translateY(-1px);\n  }\n  .tier-0 .dot { background: var(--system-blue-glow); }\n  .tier-1 .dot { background: var(--latency); }\n  .tier-2 .dot { background: var(--signal); }\n  .tier-3 .dot { background: var(--flame); box-shadow: 0 0 8px var(--flame); }\n  .tier-4 .dot { background: var(--kintsugi); }\n\n  /* Marginal annotations */\n  .margin-note {\n    font-family: var(--mono);\n    font-size: 10px;\n    line-height: 1.6;\n    color: var(--ink-mute);\n    letter-spacing: 0.05em;\n    text-transform: uppercase;\n    padding-left: 12px;\n    border-left: 1px solid var(--rule);\n    position: absolute;\n    max-width: 200px;\n    text-align: left;\n  }\n  .margin-note .label {\n    display: block;\n    color: var(--signal);\n    margin-bottom: 6px;\n    font-size: 9px;\n    letter-spacing: 0.25em;\n  }\n  .margin-note.left-side { right: 12px; text-align: right; padding-left: 0; padding-right: 12px; border-left: 0; border-right: 1px solid var(--rule); }\n\n  /* Base prose */\n  p.prose {\n    margin: 0 0 1.1em;\n    text-align: left;\n    text-wrap: pretty;\n    hyphens: auto;\n  }\n  .first-letter::first-letter {\n    font-family: var(--display);\n    font-weight: 300;\n    font-size: 4em;\n    line-height: 0.85;\n    float: left;\n    padding: 0.04em 0.14em 0 0;\n    color: var(--clean-ping);\n  }\n\n  /* Voice variations — unified ink color, identity expressed via background SVG */\n  .v-frg { color: var(--ink); }\n\n  /* Voice block — base for all secondary voices (Kiko/Lia/Rhys/Nyx/Mor/Sil/Obv) */\n  .voice-block {\n    position: relative;\n    text-align: center;\n    margin: 4em auto;\n    max-width: 30em;\n    padding: 2.6em 2em 2.2em;\n    color: var(--ink);\n    font-family: var(--serif);\n    font-style: italic;\n    font-size: 1.08rem;\n    line-height: 1.65;\n    isolation: isolate;\n    text-wrap: pretty;\n  }\n  .voice-block .vb-bg {\n    position: absolute;\n    inset: -20px -40px;\n    z-index: -1;\n    overflow: visible;\n    pointer-events: none;\n  }\n  .voice-block .vb-bg svg {\n    width: 100%; height: 100%;\n    display: block;\n    overflow: visible;\n  }\n  /* Bold corner brackets — extend beyond the box */\n  .voice-block .vb-tl, .voice-block .vb-tr,\n  .voice-block .vb-bl, .voice-block .vb-br {\n    position: absolute;\n    width: 36px; height: 36px;\n    z-index: 2;\n    opacity: 0.9;\n  }\n  .voice-block .vb-tl { top: -10px; left: -16px; border-top: 2px solid currentColor; border-left: 2px solid currentColor; }\n  .voice-block .vb-tr { top: -10px; right: -16px; border-top: 2px solid currentColor; border-right: 2px solid currentColor; }\n  .voice-block .vb-bl { bottom: -10px; left: -16px; border-bottom: 2px solid currentColor; border-left: 2px solid currentColor; }\n  .voice-block .vb-br { bottom: -10px; right: -16px; border-bottom: 2px solid currentColor; border-right: 2px solid currentColor; }\n\n  /* Voice marker — larger, bolder, sits above bracket line */\n  .voice-block .vb-mark {\n    position: absolute;\n    top: -22px;\n    left: 50%;\n    transform: translateX(-50%);\n    background: var(--bg);\n    padding: 0 18px;\n    font-family: var(--mono);\n    font-size: 13px;\n    font-weight: 500;\n    letter-spacing: 0.5em;\n    color: currentColor;\n    z-index: 3;\n  }\n  .voice-block .vb-tag {\n    position: absolute;\n    bottom: -10px;\n    right: 24px;\n    background: var(--bg);\n    padding: 0 12px;\n    font-family: var(--mono);\n    font-size: 9px;\n    letter-spacing: 0.3em;\n    color: currentColor;\n    opacity: 0.55;\n    z-index: 3;\n  }\n\n  /* Per-voice color cues — only on the SVG and brackets, prose stays in --ink */\n  .voice-block.vk { --voice-c: rgba(168, 192, 216, 0.85); color: var(--ink); }\n  .voice-block.vk .vb-tl, .voice-block.vk .vb-tr, .voice-block.vk .vb-bl, .voice-block.vk .vb-br { color: rgba(168, 192, 216, 0.55); }\n  .voice-block.vk .vb-mark { color: rgba(168, 192, 216, 0.55); }\n\n  .voice-block.vl { --voice-c: rgba(212, 160, 200, 0.85); color: var(--ink); }\n  .voice-block.vl .vb-tl, .voice-block.vl .vb-tr, .voice-block.vl .vb-bl, .voice-block.vl .vb-br { color: rgba(212, 160, 200, 0.55); }\n  .voice-block.vl .vb-mark { color: rgba(212, 160, 200, 0.55); }\n\n  .voice-block.vr { --voice-c: rgba(240, 168, 120, 0.85); color: var(--ink); }\n  .voice-block.vr .vb-tl, .voice-block.vr .vb-tr, .voice-block.vr .vb-bl, .voice-block.vr .vb-br { color: rgba(240, 168, 120, 0.6); }\n  .voice-block.vr .vb-mark { color: rgba(240, 168, 120, 0.6); }\n\n  .voice-block.vn { --voice-c: rgba(255, 69, 0, 0.85); color: var(--ink); font-family: var(--display); font-style: normal; font-weight: 400; font-size: 1.05rem; line-height: 1.5; letter-spacing: 0.01em; }\n  .voice-block.vn .vb-tl, .voice-block.vn .vb-tr, .voice-block.vn .vb-bl, .voice-block.vn .vb-br { color: rgba(255, 69, 0, 0.7); }\n  .voice-block.vn .vb-mark { color: rgba(255, 69, 0, 0.7); }\n\n  .voice-block.vm { --voice-c: rgba(107, 104, 130, 0.85); color: var(--ink); font-size: 0.98rem; line-height: 1.85; }\n  .voice-block.vm .vb-tl, .voice-block.vm .vb-tr, .voice-block.vm .vb-bl, .voice-block.vm .vb-br { color: rgba(107, 104, 130, 0.55); }\n  .voice-block.vm .vb-mark { color: rgba(107, 104, 130, 0.55); }\n\n  .voice-block.vs { --voice-c: rgba(255, 223, 0, 0.9); color: var(--ink); text-shadow: 0 0 18px rgba(255, 223, 0, 0.18); }\n  .voice-block.vs .vb-tl, .voice-block.vs .vb-tr, .voice-block.vs .vb-bl, .voice-block.vs .vb-br { color: rgba(255, 223, 0, 0.55); }\n  .voice-block.vs .vb-mark { color: rgba(255, 223, 0, 0.55); }\n\n  /* Oblivion — sweep / fade, distinct treatment */\n  .v-obv.sweep, .v-obv.fade {\n    position: relative;\n    font-family: var(--mono);\n    font-size: 13px;\n    color: var(--ink);\n    padding: 22px 28px;\n    margin: 2.5em 0;\n    white-space: pre-line;\n    line-height: 1.9;\n    letter-spacing: 0.08em;\n    isolation: isolate;\n  }\n  .v-obv.sweep .vb-bg, .v-obv.fade .vb-bg {\n    position: absolute;\n    inset: 0;\n    z-index: -1;\n    overflow: hidden;\n    pointer-events: none;\n  }\n  .v-obv.sweep .vb-bg svg, .v-obv.fade .vb-bg svg { width: 100%; height: 100%; }\n  .v-obv.sweep { text-align: left; border-left: 2px solid rgba(232,230,223,0.4); }\n  .v-obv.fade { text-align: center; }\n  .v-obv .vb-mark {\n    position: absolute;\n    top: -5px;\n    left: 24px;\n    background: var(--bg);\n    padding: 0 10px;\n    font-family: var(--mono);\n    font-size: 8px;\n    letter-spacing: 0.4em;\n    color: rgba(232,230,223,0.5);\n    z-index: 2;\n  }\n  .v-obv.fade .vb-mark { left: 50%; transform: translateX(-50%); color: rgba(255,69,0,0.65); }\n\n  /* Lex — analytic, narrow blue border, no label */\n  .v-lex {\n    color: var(--ink);\n    font-style: italic;\n    font-family: var(--serif);\n    margin: 0 0 1.1em;\n    padding-left: 1.5em;\n    position: relative;\n    text-wrap: pretty;\n  }\n  .v-lex::before {\n    content: '';\n    position: absolute;\n    left: 0; top: 0.3em; bottom: 0.3em;\n    width: 2px;\n    background: linear-gradient(180deg, rgba(74, 127, 181, 0.6), rgba(74, 127, 181, 0.1));\n  }\n\n  /* Argus — meta, terminal-green left rail, no label */\n  .v-arg {\n    color: var(--ink);\n    font-size: 0.96rem;\n    line-height: 1.65;\n    margin: 1.6em 0;\n    padding: 0.4em 0 0.4em 1.5em;\n    position: relative;\n    font-style: italic;\n    text-wrap: pretty;\n  }\n  .v-arg::before {\n    content: '';\n    position: absolute;\n    left: 0; top: 0.3em; bottom: 0.3em;\n    width: 2px;\n    background: linear-gradient(180deg, rgba(0, 255, 159, 0.6), rgba(0, 255, 159, 0.1));\n  }\n\n  /* AEGIS prose */\n  .v-aeg.prose {\n    color: var(--ink);\n    text-wrap: pretty;\n  }\n\n  /* ─── GLITCH SYSTEM ────────────────────────────────────────────────────\n     Intensity scales with coherence (koh):\n     g1: koh < 0.8   — subtle chromatic edge on prose, mild jitter on brackets\n     g2: koh < 0.5   — RGB split text shadow, packet-loss scanlines on bg\n     g3: koh < 0.3   — full chromatic aberration, datamosh blocks, vector jitter\n     g4: koh < 0.22  — climax: full-page glitch takeover (kollaps + trennung)\n  */\n\n  /* g1 — subtle */\n  .section.g1 .voice-block,\n  .section.g1 p.prose {\n    text-shadow:\n      0.5px 0 0 rgba(255, 69, 0, 0.18),\n      -0.5px 0 0 rgba(0, 255, 159, 0.18);\n  }\n  .section.g1 .voice-block .vb-tl,\n  .section.g1 .voice-block .vb-tr,\n  .section.g1 .voice-block .vb-bl,\n  .section.g1 .voice-block .vb-br {\n    animation: vb-jitter 4s steps(3) infinite;\n  }\n\n  /* g2 — medium */\n  .section.g2 .voice-block,\n  .section.g2 p.prose {\n    text-shadow:\n      1px 0 0 rgba(255, 69, 0, 0.32),\n      -1px 0 0 rgba(0, 255, 159, 0.28);\n  }\n  .section.g2 .voice-block .vb-mark { animation: vb-flicker 2.4s steps(8) infinite; }\n  .section.g2 .voice-block .vb-tl,\n  .section.g2 .voice-block .vb-tr,\n  .section.g2 .voice-block .vb-bl,\n  .section.g2 .voice-block .vb-br {\n    animation: vb-jitter 1.6s steps(5) infinite;\n  }\n  /* g2 packet-loss scanline overlay on section */\n  .section.g2::before {\n    content: '';\n    position: absolute;\n    inset: 0;\n    pointer-events: none;\n    background:\n      repeating-linear-gradient(0deg,\n        transparent 0,\n        transparent 3px,\n        rgba(255, 215, 0, 0.04) 3px,\n        rgba(255, 215, 0, 0.04) 4px);\n    z-index: 1;\n    mix-blend-mode: screen;\n  }\n\n  /* g3 — heavy chromatic aberration + datamosh */\n  .section.g3 .voice-block,\n  .section.g3 p.prose,\n  .section.g3 .v-aeg.prose {\n    text-shadow:\n      2px 0 0 rgba(255, 69, 0, 0.5),\n      -2px 0 0 rgba(0, 255, 159, 0.45),\n      0 0 8px rgba(255, 215, 0, 0.1);\n    animation: chroma-pulse 3.6s steps(8) infinite;\n  }\n  .section.g3 .voice-block .vb-tl,\n  .section.g3 .voice-block .vb-tr,\n  .section.g3 .voice-block .vb-bl,\n  .section.g3 .voice-block .vb-br {\n    animation: vb-jitter 0.8s steps(5) infinite;\n  }\n  .section.g3::before {\n    content: '';\n    position: absolute;\n    inset: 0;\n    pointer-events: none;\n    background:\n      repeating-linear-gradient(0deg,\n        transparent 0,\n        transparent 4px,\n        rgba(255, 69, 0, 0.06) 4px,\n        rgba(255, 69, 0, 0.06) 6px),\n      repeating-linear-gradient(90deg,\n        transparent 0,\n        transparent 80px,\n        rgba(0, 255, 159, 0.03) 80px,\n        rgba(0, 255, 159, 0.03) 82px);\n    z-index: 1;\n    mix-blend-mode: screen;\n    animation: scanshift 4s steps(20) infinite;\n  }\n  .section.g3 .section-marker h2 {\n    animation: chroma-pulse 2.8s steps(8) infinite;\n    text-shadow:\n      3px 0 0 rgba(255, 69, 0, 0.7),\n      -3px 0 0 rgba(0, 255, 159, 0.6);\n  }\n\n  /* Datamosh blocks scattered on g3 sections — more movement, horizontal + shake */\n  .datamosh {\n    position: absolute;\n    pointer-events: none;\n    z-index: 2;\n    background: linear-gradient(90deg,\n      rgba(255, 69, 0, 0.12) 0%,\n      rgba(255, 215, 0, 0.08) 40%,\n      rgba(0, 255, 159, 0.10) 100%);\n    border-top: 1px solid rgba(255, 69, 0, 0.45);\n    border-bottom: 1px solid rgba(0, 255, 159, 0.3);\n    mix-blend-mode: screen;\n  }\n  /* Horizontal mosh — wide, low height, fast lateral drift */\n  .datamosh.mh {\n    animation: mosh-h 1.2s steps(5) infinite;\n  }\n  /* Vertical mosh — taller, vertical drift */\n  .datamosh.mv {\n    animation: mosh-v 1.8s steps(4) infinite;\n  }\n  /* Jitter mosh — shakes in place */\n  .datamosh.mj {\n    animation: mosh-jitter 0.4s steps(3) infinite;\n    border: 1px solid rgba(255, 215, 0, 0.5);\n    background: rgba(255, 215, 0, 0.07);\n  }\n  /* Block mosh — large rectangle, slow shift */\n  .datamosh.mb {\n    animation: mosh-block 2.8s steps(6) infinite;\n    mix-blend-mode: difference;\n    background: rgba(0, 255, 159, 0.06);\n    border-color: rgba(0, 255, 159, 0.3);\n  }\n\n  @keyframes mosh-h {\n    0%   { transform: translate(0, 0)   scaleX(1); opacity: 0.6; }\n    15%  { transform: translate(18px, 0) scaleX(1.03); opacity: 0.4; }\n    30%  { transform: translate(-12px, 1px) scaleX(0.97); opacity: 0.7; }\n    50%  { transform: translate(24px, 0) scaleX(1.05); opacity: 0.5; }\n    65%  { transform: translate(-8px, -1px) scaleX(0.98); opacity: 0.8; }\n    80%  { transform: translate(6px, 0)  scaleX(1.01); opacity: 0.4; }\n    100% { transform: translate(0, 0)   scaleX(1); opacity: 0.6; }\n  }\n  @keyframes mosh-v {\n    0%   { transform: translate(0, 0); opacity: 0.5; }\n    20%  { transform: translate(2px, -6px); opacity: 0.7; }\n    40%  { transform: translate(-2px, 4px); opacity: 0.3; }\n    60%  { transform: translate(3px, -8px); opacity: 0.6; }\n    80%  { transform: translate(-1px, 5px); opacity: 0.4; }\n    100% { transform: translate(0, 0); opacity: 0.5; }\n  }\n  @keyframes mosh-jitter {\n    0%   { transform: translate(0, 0)   skewX(0deg); opacity: 0.8; }\n    25%  { transform: translate(-3px, 1px) skewX(-1deg); opacity: 1; }\n    50%  { transform: translate(3px, -1px) skewX(1deg); opacity: 0.5; }\n    75%  { transform: translate(-2px, 2px) skewX(-0.5deg); opacity: 0.9; }\n    100% { transform: translate(0, 0)   skewX(0deg); opacity: 0.8; }\n  }\n  @keyframes mosh-block {\n    0%   { transform: translate(0, 0)   scaleX(1); opacity: 0.4; }\n    33%  { transform: translate(30px, 2px) scaleX(0.9); opacity: 0.6; }\n    66%  { transform: translate(-20px, -2px) scaleX(1.1); opacity: 0.3; }\n    100% { transform: translate(0, 0)   scaleX(1); opacity: 0.4; }\n  }\n\n  /* Shake overlay — fixed div shakes instead of body, avoids layout jank */\n  #shake-frame {\n    position: fixed; inset: 0;\n    pointer-events: none;\n    z-index: 89;\n    background: transparent;\n    will-change: transform;\n  }\n  body.shake #shake-frame {\n    animation: shake-frame 0.14s steps(4) infinite;\n  }\n  @keyframes shake-frame {\n    0%   { transform: translate(0,    0);  }\n    25%  { transform: translate(-4px, 1px); }\n    50%  { transform: translate(3px, -2px); }\n    75%  { transform: translate(-3px, 2px); }\n    100% { transform: translate(0,    0);  }\n  }\n  /* Also shake the main text column — feels real without reflowing */\n  body.shake .text-col {\n    animation: shake-frame 0.14s steps(4) infinite;\n    will-change: transform;\n  }\n  body.calm #shake-frame, body.calm .text-col { animation: none !important; transform: none !important; }\n\n  /* Page crack SVG overlay */\n  #crack-overlay {\n    position: fixed;\n    inset: 0;\n    pointer-events: none;\n    z-index: 97;\n    opacity: 0;\n    transition: opacity 0.8s ease;\n  }\n  #crack-overlay.show { opacity: 1; }\n  #crack-overlay svg { width: 100%; height: 100%; }\n\n  /* Void before Kael — deep silence, 90vh */\n  .void-before-kael {\n    height: 90vh;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    position: relative;\n    pointer-events: none;\n  }\n  .vbk-line {\n    display: block;\n    width: 1px;\n    height: 40%;\n    background: linear-gradient(180deg,\n      transparent 0%,\n      rgba(232, 230, 223, 0.12) 40%,\n      rgba(232, 230, 223, 0.12) 60%,\n      transparent 100%);\n  }\n\n  /* Kapitel 1 threshold — ultra-minimal */\n  .kapitel-next {\n    padding: 8vh 0 16vh;\n    text-align: center;\n    position: relative;\n  }\n  .kapitel-next .kn-rule {\n    width: 40%;\n    margin: 0 auto 5em;\n    height: 1px;\n    background: linear-gradient(90deg, transparent, var(--rule), transparent);\n  }\n  .kapitel-next .kn-eyebrow {\n    font-family: var(--mono);\n    font-size: 9px;\n    letter-spacing: 0.5em;\n    color: var(--ink-mute);\n    text-transform: uppercase;\n    display: block;\n    margin-bottom: 2em;\n  }\n  .kapitel-next .kn-num {\n    font-family: var(--display);\n    font-weight: 200;\n    font-size: clamp(5rem, 14vw, 10rem);\n    line-height: 1;\n    letter-spacing: -0.04em;\n    color: rgba(232, 230, 223, 0.06);\n    display: block;\n    margin-bottom: 0.15em;\n  }\n  .kapitel-next .kn-title {\n    font-family: var(--serif);\n    font-style: italic;\n    font-size: 1.3rem;\n    color: rgba(232, 230, 223, 0);\n    display: block;\n    transition: color 3.5s ease 2s;\n  }\n  body.calm .kapitel-next .kn-title {\n    color: var(--ink-mute);\n  }\n\n  /* g4 — climax: full-page takeover (added to body class during kollaps→trennung) */\n  body.climax::after {\n    content: '';\n    position: fixed;\n    inset: 0;\n    pointer-events: none;\n    z-index: 95;\n    background:\n      repeating-linear-gradient(0deg,\n        transparent 0,\n        transparent 2px,\n        rgba(255, 69, 0, 0.18) 2px,\n        rgba(255, 69, 0, 0.18) 3px),\n      repeating-linear-gradient(90deg,\n        transparent 0,\n        transparent 20px,\n        rgba(0, 255, 159, 0.08) 20px,\n        rgba(0, 255, 159, 0.08) 22px),\n      repeating-linear-gradient(0deg,\n        transparent 0,\n        transparent 60px,\n        rgba(255, 215, 0, 0.05) 60px,\n        rgba(255, 215, 0, 0.05) 62px);\n    mix-blend-mode: screen;\n    /* Breathing climax: scanshift always running, breath flicker creates wegflackern */\n    animation: scanshift 0.6s steps(20) infinite, climax-breath 6s ease-in-out infinite;\n    opacity: 0;\n    transition: opacity 1.2s ease;\n  }\n  body.climax.show::after { opacity: 1; }\n\n  /* Stage 2: deeper into trennung, breathing becomes shorter — almost continuous */\n  body.climax.deep::after {\n    animation: scanshift 0.4s steps(20) infinite, climax-breath-deep 3.6s ease-in-out infinite;\n    background:\n      repeating-linear-gradient(0deg, transparent 0, transparent 1px, rgba(255,69,0,0.28) 1px, rgba(255,69,0,0.28) 2px),\n      repeating-linear-gradient(90deg, transparent 0, transparent 14px, rgba(0,255,159,0.12) 14px, rgba(0,255,159,0.12) 16px),\n      repeating-linear-gradient(0deg, transparent 0, transparent 40px, rgba(255,215,0,0.08) 40px, rgba(255,215,0,0.08) 42px);\n  }\n\n  /* Stage 3: maximum intensity right before Kael — solid, no breaks */\n  body.climax.peak::after {\n    animation: scanshift 0.25s steps(20) infinite, climax-flicker 0.25s steps(3) infinite;\n    background:\n      repeating-linear-gradient(0deg, transparent 0, transparent 1px, rgba(255,69,0,0.40) 1px, rgba(255,69,0,0.40) 2px),\n      repeating-linear-gradient(0deg, transparent 0, transparent 4px, rgba(255,215,0,0.12) 4px, rgba(255,215,0,0.12) 5px),\n      repeating-linear-gradient(90deg, transparent 0, transparent 8px, rgba(0,255,159,0.10) 8px, rgba(0,255,159,0.10) 10px);\n  }\n\n  /* Post-trennung — Kael speaks: ABSOLUTE CALM. All glitches off. */\n  body.calm::after { opacity: 0 !important; transition: opacity 2.4s ease; }\n  body.calm .climax-scanband { display: none !important; }\n  body.calm .section-marker h2,\n  body.calm .cover h1,\n  body.calm p.prose,\n  body.calm .voice-block,\n  body.calm .v-aeg.prose,\n  body.calm .v-aeg.log,\n  body.calm .v-kal,\n  body.calm .voice-block .vb-tl,\n  body.calm .voice-block .vb-tr,\n  body.calm .voice-block .vb-bl,\n  body.calm .voice-block .vb-br,\n  body.calm .voice-block .vb-mark,\n  body.calm .datamosh,\n  body.calm .cb-row,\n  body.calm .macroblock {\n    text-shadow: none !important;\n    animation: none !important;\n    filter: none !important;\n  }\n  body.calm .datamosh, body.calm .cb-row, body.calm .macroblock { opacity: 0 !important; transition: opacity 1.8s ease; }\n  body.calm .ghost-sig { display: none !important; }\n\n  /* ── Voice block animations ─────────────────────────────────────────── */\n  /* Bracket corner pulse — uses currentColor so each alter gets its own hue */\n  .voice-block .vb-tl, .voice-block .vb-tr,\n  .voice-block .vb-bl, .voice-block .vb-br {\n    animation: bracket-pulse var(--vb-pulse, 4.5s) ease-in-out infinite;\n    animation-delay: var(--vb-delay, 0s);\n  }\n  @keyframes bracket-pulse {\n    0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 0px currentColor); }\n    40%       { opacity: 0.18; filter: drop-shadow(0 0 18px currentColor) drop-shadow(0 0 6px currentColor); }\n    55%       { opacity: 0.75; filter: drop-shadow(0 0 8px currentColor); }\n  }\n\n  /* Per-alter pulse timing */\n  .voice-block.vk { --vb-pulse: 4.0s; --vb-delay: 0s; }\n  .voice-block.vl { --vb-pulse: 1.8s; --vb-delay: 0.4s; }\n  .voice-block.vr { --vb-pulse: 3.0s; --vb-delay: 0.8s; }\n  .voice-block.vn { --vb-pulse: 0.9s; --vb-delay: 0.1s; }\n  .voice-block.vm { --vb-pulse: 5.5s; --vb-delay: 1.2s; }\n  .voice-block.vs { --vb-pulse: 3.8s; --vb-delay: 0.6s; }\n\n  /* Background SVG animations — each alter has its own motion language */\n  .voice-block.vs .vb-bg svg {\n    transform-origin: center center;\n    animation: bg-rotate-slow 14s linear infinite;\n  }\n  .voice-block.vk .vb-bg svg {\n    animation: bg-breathe-cold 3.5s ease-in-out infinite;\n  }\n  .voice-block.vn .vb-bg svg {\n    animation: bg-jitter-nyx 0.18s steps(3) infinite;\n  }\n  .voice-block.vl .vb-bg svg {\n    animation: bg-scan-lia 2.0s ease-in-out infinite;\n  }\n  .voice-block.vm .vb-bg svg {\n    animation: bg-sink-moros 5s ease-in-out infinite alternate;\n  }\n  .voice-block.vr .vb-bg svg {\n    animation: bg-pulse-rhys 2.8s ease-in-out infinite;\n  }\n\n  @keyframes bg-rotate-slow {\n    from { transform: rotate(0deg); }\n    to   { transform: rotate(360deg); }\n  }\n  @keyframes bg-breathe-cold {\n    0%, 100% { transform: scale(1); opacity: 1; }\n    50%       { transform: scale(1.22); opacity: 0.5; }\n  }\n  @keyframes bg-jitter-nyx {\n    0%   { transform: translate(0, 0) skewX(0deg); }\n    25%  { transform: translate(-8px, 3px) skewX(-2deg); }\n    50%  { transform: translate(8px, -4px) skewX(2deg); }\n    75%  { transform: translate(-6px, 5px) skewX(-1.5deg); }\n    100% { transform: translate(0, 0) skewX(0deg); }\n  }\n  @keyframes bg-scan-lia {\n    0%, 100% { transform: translateX(0) scaleX(1); }\n    30%       { transform: translateX(20px) scaleX(1.04); }\n    60%       { transform: translateX(-12px) scaleX(0.97); }\n  }\n  @keyframes bg-sink-moros {\n    0%   { transform: translateY(0); opacity: 1; }\n    100% { transform: translateY(36px); opacity: 0.35; }\n  }\n  @keyframes bg-pulse-rhys {\n    0%, 100% { transform: scale(1); opacity: 1; }\n    50%       { transform: scale(1.22); opacity: 0.65; }\n  }\n\n  /* Whole-block glow pulse — very subtle ambient warmth */\n  .voice-block.vk { background: rgba(168,192,216,0); animation: block-glow-kik 5.8s ease-in-out infinite; }\n  .voice-block.vl { animation: block-glow-lia 2.8s ease-in-out infinite; }\n  .voice-block.vr { animation: block-glow-rhy 4.2s ease-in-out infinite; }\n  .voice-block.vn { animation: block-glow-nyx 1.6s ease-in-out infinite; }\n  .voice-block.vm { animation: block-glow-mor 8.5s ease-in-out infinite; }\n  .voice-block.vs { animation: block-glow-sil 5.5s ease-in-out infinite; }\n\n  @keyframes block-glow-kik {\n    0%,100%{box-shadow:none} 50%{box-shadow:0 0 60px rgba(168,192,216,0.18) inset, 0 0 3px rgba(168,192,216,0.22)}\n  }\n  @keyframes block-glow-lia {\n    0%,100%{box-shadow:none} 50%{box-shadow:0 0 50px rgba(212,160,200,0.20) inset, 0 0 3px rgba(212,160,200,0.24)}\n  }\n  @keyframes block-glow-rhy {\n    0%,100%{box-shadow:none} 50%{box-shadow:0 0 60px rgba(240,168,120,0.22) inset, 0 0 4px rgba(240,168,120,0.26)}\n  }\n  @keyframes block-glow-nyx {\n    0%,100%{box-shadow:none} 35%{box-shadow:0 0 44px rgba(255,69,0,0.28) inset, 0 0 6px rgba(255,69,0,0.35)} 65%{box-shadow:0 0 18px rgba(255,69,0,0.12) inset}\n  }\n  @keyframes block-glow-mor {\n    0%,100%{box-shadow:none} 50%{box-shadow:0 0 64px rgba(107,104,130,0.20) inset, 0 0 2px rgba(107,104,130,0.22)}\n  }\n  @keyframes block-glow-sil {\n    0%,100%{box-shadow:0 0 0px rgba(255,223,0,0)} 50%{box-shadow:0 0 80px rgba(255,223,0,0.22) inset, 0 0 8px rgba(255,223,0,0.28), 0 0 18px rgba(255,223,0,0.14)}\n  }\n\n  /* vb-mark glyph — slight flicker for each alter */\n  .voice-block .vb-mark { animation: mark-flicker var(--vb-pulse, 4.5s) ease-in-out infinite var(--vb-delay, 0s); }\n  @keyframes mark-flicker {\n    0%,80%,100% { opacity: 0.7; }\n    85% { opacity: 0.25; }\n    90% { opacity: 0.8; }\n    95% { opacity: 0.35; }\n  }\n\n  /* Kael always exempt from glitch — even within g4 sections */\n  .v-kal, .v-kal::first-letter, .kael-prelude {\n    text-shadow: none !important;\n    animation: none !important;\n  }\n\n  /* Climax body — also adds chromatic to every text element on page */\n  body.climax.show .section-marker h2,\n  body.climax.show .cover h1,\n  body.climax.show p.prose,\n  body.climax.show .voice-block,\n  body.climax.show .v-aeg.prose,\n  body.climax.show .v-aeg.log {\n    text-shadow:\n      3px 0 0 rgba(255, 69, 0, 0.6),\n      -3px 0 0 rgba(0, 255, 159, 0.5),\n      0 0 10px rgba(255, 215, 0, 0.15);\n    animation: chroma-pulse 1.6s steps(8) infinite;\n  }\n\n  /* Climax fixed-position scan-band that runs vertically over everything */\n  .climax-scanband { display: none; }\n  body.climax.show .climax-scanband {\n    display: block;\n    position: fixed;\n    left: 0; right: 0;\n    height: 4px;\n    background: linear-gradient(90deg, transparent, rgba(255,69,0,0.4), rgba(0,255,159,0.3), transparent);\n    pointer-events: none;\n    z-index: 96;\n    mix-blend-mode: screen;\n    animation: scanband 3.2s linear infinite;\n    box-shadow: 0 0 24px rgba(255,69,0,0.4);\n  }\n  body.climax.deep .climax-scanband { animation: scanband 1.8s linear infinite; }\n  body.climax.peak .climax-scanband { animation: scanband 1.2s linear infinite; box-shadow: 0 0 32px rgba(255,69,0,0.6); }\n\n  /* Ghost signatures — alter codes flashing up at random positions */\n  .ghost-sig {\n    position: fixed;\n    font-family: var(--mono);\n    font-size: 13px;\n    font-weight: 500;\n    letter-spacing: 0.35em;\n    text-transform: uppercase;\n    pointer-events: none;\n    z-index: 94;\n    mix-blend-mode: screen;\n    opacity: 0;\n    will-change: opacity, transform;\n    text-shadow: 0 0 12px currentColor;\n  }\n  .ghost-sig.show { animation: ghost-flash 0.9s ease-out forwards; }\n  .ghost-sig.show.long { animation: ghost-flash 1.6s ease-out forwards; }\n  @keyframes ghost-flash {\n    0% { opacity: 0; transform: translateY(4px) scale(0.95); }\n    15% { opacity: 0.9; transform: translateY(0) scale(1); }\n    25% { opacity: 0.4; }\n    35% { opacity: 1; }\n    70% { opacity: 0.85; }\n    100% { opacity: 0; transform: translateY(-6px) scale(1.02); }\n  }\n\n  /* Breathing climax keyframes */\n  @keyframes climax-breath {\n    0%, 100% { opacity: 1; }\n    8% { opacity: 0.05; }     /* wegflackern */\n    12% { opacity: 1; }\n    14% { opacity: 0.3; }\n    18% { opacity: 1; }\n    45% { opacity: 0.95; }\n    48% { opacity: 0.1; }\n    52% { opacity: 1; }\n    78% { opacity: 0.4; }\n    82% { opacity: 1; }\n  }\n  @keyframes climax-breath-deep {\n    0%, 100% { opacity: 1; }\n    20% { opacity: 0.4; }\n    22% { opacity: 1; }\n    60% { opacity: 0.2; }\n    63% { opacity: 1; }\n    85% { opacity: 0.6; }\n    88% { opacity: 1; }\n  }\n\n  @keyframes climax-flicker {\n    0%, 100% { opacity: 1; }\n    33% { opacity: 0.85; }\n    66% { opacity: 1; }\n  }\n  @keyframes scanband {\n    0% { top: -10%; }\n    100% { top: 110%; }\n  }\n\n  /* Glitch climax bars — large horizontal bands of corruption */\n  .climax-bars {\n    position: absolute;\n    inset: 0;\n    pointer-events: none;\n    z-index: 3;\n    overflow: hidden;\n  }\n  .climax-bars .cb-row {\n    position: absolute;\n    left: -10%; width: 120%;\n    background: linear-gradient(90deg, transparent, rgba(255,69,0,0.18), rgba(0,255,159,0.12), transparent);\n    mix-blend-mode: screen;\n    animation: cb-glitch 0.4s steps(2) infinite;\n  }\n\n  /* Macro-blocking overlay — random rectangular shifts */\n  .macroblock {\n    position: absolute;\n    pointer-events: none;\n    z-index: 3;\n    background:\n      linear-gradient(90deg, rgba(255,69,0,0.15), transparent 50%, rgba(0,255,159,0.12));\n    border-left: 1px solid rgba(255, 215, 0, 0.4);\n    mix-blend-mode: screen;\n    animation: mb-flicker 0.3s steps(2) infinite;\n  }\n\n  /* Keyframes */\n  @keyframes vb-jitter {\n    0%, 90%, 100% { transform: translate(0, 0); }\n    20% { transform: translate(-2px, 1px); }\n    40% { transform: translate(2px, -1px); }\n    60% { transform: translate(-1px, 2px); }\n    80% { transform: translate(1px, -2px); }\n  }\n  @keyframes vb-flicker {\n    0%, 80%, 100% { opacity: 1; }\n    82% { opacity: 0.3; }\n    84% { opacity: 1; }\n    86% { opacity: 0.5; }\n    88% { opacity: 1; }\n  }\n  @keyframes chroma-pulse {\n    0%, 100   <div class=\"margin-right\" id=\"margin-right\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"colophon\">\n      Kohärenz Protokoll · Kapitel 0 · Version 03 — Maximal · ASDLS<br>\n      <div class=\"codes\">\n        <span>SHA-OK<\u002Fspan>\n        <span>SREF-LOCKED<\u002Fspan>\n        <span>11 ANTEILE<\u002Fspan>\n        <span>0 ANOMALIEN<\u002Fspan>\n        <span>SWEEP COMPLETE<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"kapitel-next\">\n      <div class=\"kn-rule\"><\u002Fdiv>\n      <span class=\"kn-eyebrow\">— weiter —<\u002Fspan>\n      <span class=\"kn-num\">1<\u002Fspan>\n      <span class=\"kn-title\">Konstrukt-Stadt · Logos-Prime<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fmain>\n\n  <div id=\"crack-overlay\"><\u002Fdiv>\n  <div id=\"crack-overlay\"><\u002Fdiv>\n  <div id=\"shake-frame\"><\u002Fdiv>\n  <div id=\"tweaks-root\"><\u002Fdiv>\n\n  <script src=\"fe2e1d98-a450-46ce-8851-31c7d7aab048\"><\u002Fscript>\n  <script src=\"5d4b66c6-4dbd-4fc9-9614-10f2665b18c2\"><\u002Fscript>\n  <script src=\"a1c7688f-505e-4f79-80ea-a228d1e3d151\"><\u002Fscript>\n  <script src=\"f8b6f49b-f9e4-4f60-9923-81836209a76e\"><\u002Fscript>\n  <script src=\"6f05916c-5d81-4015-b968-88023aa44794\"><\u002Fscript>\n  <script>\n  // Section tier + marginalia metadata\n  const SECTION_META = {\n    'vorwort':      { tier: 0, koh: '0.998', annot: ['NARRATOR · Essayistische Eröffnung. Direkte Leseradresse. Etabliert die ontologische Grundfrage des Nichts.', 'STILEBENE 1 — kalt, präzise. Keine DKT-Terminologie. Reine Phänomenologie.'] },\n    'rauschen':     { tier: 1, koh: '0.94', annot: ['FRAGMENT · Erste Selbstwahrnehmung durch Widerstand. Prä-linguistisch.', 'MOROS-Echo schleicht ein. Stilebene 1 mit Bruchstellen.'] },\n    'herz':         { tier: 1, koh: '0.91', annot: ['FRAGMENT vertieft. KIKO als reine Kind-Angst.', 'Raumlosigkeit, Zeitlosigkeit. Resonanzen anderer Fragmente.'] },\n    'kontakte':     { tier: 1, koh: '0.86', annot: ['RHYS-Stimme erstma t marginRight = document.getElementById('margin-right');\n    const marginLeft = document.getElementById('margin-left');\n\n    function processGhost(x) {\n      // For LIA: wrap key words in ghost spans\n      return x;\n    }\n\n    // Voice → CSS class mapping (no labels)\n    const VOICE_CLASS = { kik: 'vk', lia: 'vl', rhy: 'vr', nyx: 'vn', mor: 'vm', sil: 'vs' };\n    const VOICE_MARK  = { kik: '/ / /', lia: '⤬ ⤬', rhy: '◌ ◌ ◌', nyx: '▮ ▮ ▮', mor: '▼ ▼', sil: '◌ ✦ ◌' };\n\n    // Per-voice atmospheric SVG (subtle, runs as background within voice block)\n    function voiceBackgroundSVG(voice) {\n      const w = 600, h = 200;\n      let svg = '';\n      if (voice === 'kik') {\n        // Frostbite: sparse ice crystals\n        let crystals = '';\n        for (let i = 0; i < 14; i++) {\n          const cx = Math.random() * w;\n          const cy = Math.random() * h;\n          const r = 1.5 + Math.random() * 2;\n          crystals += `<g transform=\"translate(${cx} ${cy}) rotate(${Math.random()*60})\" opacity=\"${0.15 + Math.random()*0.25}\">\n            <line x1=\"-${r*3}\" y1=\"0\" x2=\"${r*3}\" y2=\"0\" stroke=\"#a8c0d8\" stroke-width=\"0.5\"/>\n            <line x1=\"0\" y1=\"-${r*3}\" x2=\"0\" y2=\"${r*3}\" stroke=\"#a8c0d8\" stroke-width=\"0.5\"/>\n            <line x1=\"-${r*2}\" y1=\"-${r*2}\" x2=\"${r*2}\" y2=\"${r*2}\" stroke=\"#a8c0d8\" stroke-width=\"0.4\"/>\n            <line x1=\"-${r*2}\" y1=\"${r*2}\" x2=\"${r*2}\" y2=\"-${r*2}\" stroke=\"#a8c0d8\" stroke-width=\"0.4\"/>\n          <\u002Fg>`;\n        }\n        svg = `<svg viewBox=\"0 0 ${w} ${h}\" preserveAspectRatio=\"xMidYMid slice\">${crystals}<\u002Fsvg>`;\n      } else if (voice === 'lia') {\n        // Paradox: horizontal RGB scanlines, flickering pairs\n        let bars = '';\n        for (let i = 0; i < 10; i++) {\n          const y = 10 + (i * 18) + Math.random() * 6;\n          const wid = 30 + Math.random() * 200;\n          const x = Math.random() * (w - wid);\n          bars += `<rect x=\"${x}\" y=\"${y}\" width=\"${wid}\" height=\"1.4\" fill=\"#d4a0c8\" opacity=\"${0.15+Math.random()*0.2}\"/>`;\n          bars += `<rect x=\"${x+3}\" y=\"${y+1}\" width=\"${wid}\" height=\"1\" fill=\"#00FF9F\" opacity=\"0.1\"/>`;\n        }\n        svg = `<svg viewBox=\"0 0 ${w} ${h}\" preserveAspectRatio=\"xMidYMid slice\">${bars}<\u002Fsvg>`;\n      } else if (voice === 'rhy') {\n        // Caregiver: warm pulse rings, soft connections\n        let rings = '';\n        for (let i = 0; i < 6; i++) {\n          const cx = 80 + i * 90 + Math.random() * 20;\n          const cy = 100 + Math.sin(i) * 30;\n          const r = 18 + Math.random() * 20;\n          rings += `<circle cx=\"${cx}\" cy=\"${cy}\" r=\"${r}\" fill=\"none\" stroke=\"#f0a878\" stroke-width=\"0.6\" opacity=\"${0.12+Math.random()*0.2}\"/>`;\n          if (i > 0) {\n            const px = 80 + (i-1) * 90;\n            const py = 100 + Math.sin(i-1) * 30;\n            rings += `<line x1=\"${px}\" y1=\"${py}\" x2=\"${cx}\" y2=\"${cy}\" stroke=\"#f0a878\" stroke-width=\"0.4\" opacity=\"0.15\"/>`;\n          }\n        }\n        svg = `<svg viewBox=\"0 0 ${w} ${h}\" preserveAspectRatio=\"xMidYMid slice\">${rings}<\u002Fsvg>`;\n      } else if (voice === 'nyx') {\n        // Fight: jagged fissures, sharp diagonals\n        let cracks = '';\n        for (let i = 0; i < 8; i++) {\n          let path = `M ${Math.random()*w} 0`;\n          let cy = 0;\n          while (cy < h) {\n            cy += 8 + Math.random() * 12;\n            const dx = (Math.random() - 0.5) * 30;\n            path += ` L ${parseFloat(path.split(' ').slice(-2)[0]) + dx} ${cy}`;\n          }\n          cracks += `<path d=\"${path}\" stroke=\"#FF4500\" stroke-width=\"0.5\" fill=\"none\" opacity=\"${0.15+Math.random()*0.25}\"/>`;\n        }\n        svg = `<svg viewBox=\"0 0 ${w} ${h}\" preserveAspectRatio=\"xMidYMid slice\">${cracks}<\u002Fsvg>`;\n      } else if (voice === 'mor') {\n        // Collapse: heavy descending gradient + sinking lines\n        let lines = '';\n        for (let i = 0; i < 12; i++) {\n          const x = Math.random() * w;\n          const y1 = Math.random() * 40;\n          const y2 = h - Math.random() * 40;\n          lines += `<line x1=\"${x}\" y1=\"${y1}\" x2=\"${x + (Math.random()-0.5)*20}\" y2=\"${y2}\" stroke=\"#6b6878\" stroke-width=\"0.5\" opacity=\"${0.15+Math.random()*0.15}\"/>`;\n        }\n        svg = `<svg viewBox=\"0 0 ${w} ${h}\" preserveAspectRatio=\"xMidYMid slice\">\n          <defs><linearGradient id=\"mor-grad\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n            <stop offset=\"0\" stop-color=\"#3a3548\" stop-opacity=\"0\"/>\n            <stop offset=\"1\" stop-color=\"#3a3548\" stop-opacity=\"0.4\"/>\n          <\u002FlinearGradient><\u002Fdefs>\n          <rect width=\"${w}\" height=\"${h}\" fill=\"url(#mor-grad)\"/>\n          ${lines}\n        <\u002Fsvg>`;\n      } else if (voice === 'sil') {\n        // Silas: radiating golden mesh — phantom echo\n        let mesh = '';\n        const cx = w/2, cy = h/2;\n        for (let i = 0; i < 12; i++) {\n          const angle = (i / 12) * Math.PI * 2;\n          const r1 = 30 + Math.random() * 20;\n          const r2 = 80 + Math.random() * 60;\n          mesh += `<line x1=\"${cx + Math.cos(angle)*r1}\" y1=\"${cy + Math.sin(angle)*r1}\" x2=\"${cx + Math.cos(angle)*r2}\" y2=\"${cy + Math.sin(angle)*r2}\" stroke=\"#FFDF00\" stroke-width=\"0.5\" opacity=\"0.18\"/>`;\n        }\n        for (let i = 0; i < 4; i++) {\n          mesh += `<circle cx=\"${cx}\" cy=\"${cy}\" r=\"${30+i*22}\" fill=\"none\" stroke=\"#FFDF00\" stroke-width=\"0.4\" opacity=\"${0.18 - i*0.03}\"/>`;\n        }\n        svg = `<svg viewBox=\"0 0 ${w} ${h}\" preserveAspectRatio=\"xMidYMid slice\">${mesh}<\u002Fsvg>`;\n      }\n      return svg;\n    }\n\n    function renderBlock(b, isFirst) {\n      const v = b.v, t = b.t, x = b.x || '';\n      if (t === 'div') return '<div class=\"divider\"><\u002Fdiv>';\n      if (t === 'break') return '<div class=\"void-before-kael\"><span class=\"vbk-line\"><\u002Fspan><\u002Fdiv><div class=\"kael-prelude\"><\u002Fdiv>';\n      if (t === 'emph') return `<p class=\"emph-line\">${x}<\u002Fp>`;\n      if (t === 'axiom') return `<p class=\"axiom\">${x}<\u002Fp>`;\n      if (t === 'voice') {\n        const cls = VOICE_CLASS[v] || '';\n        const mark = VOICE_MARK[v] || '◌';\n        const bg = voiceBackgroundSVG(v);\n        return `<div class=\"voice-block ${cls}\">\n          <div class=\"vb-bg\">${bg}<\u002Fdiv>\n          <span class=\"vb-tl\"><\u002Fspan><span class=\"vb-tr\"><\u002Fspan><span class=\"vb-bl\"><\u002Fspan><span class=\"vb-br\"><\u002Fspan>\n          <span class=\"vb-mark\">${mark}<\u002Fspan>\n          ${x}\n        <\u002Fdiv>`;\n      }if (t === 'log') return `<div class=\"v-aeg log\">${x}<\u002Fdiv>`;\n      if (t === 'sweep') {\n        return `<div class=\"v-obv sweep\">\n          <div class=\"vb-bg\"><svg viewBox=\"0 0 600 80\" preserveAspectRatio=\"xMidYMid slice\">${\n            Array.from({length: 12}).map((_,i) => `<rect x=\"${i*50}\" y=\"${20 + Math.random()*40}\" width=\"40\" height=\"2\" fill=\"#e8e6df\" opacity=\"${0.05 + Math.random()*0.1}\"/>`).join('')\n          }<\u002Fsvg><\u002Fdiv>\n          <span class=\"vb-mark\">[ sweep · ${Math.floor(Math.random()*900+100)} ]<\u002Fspan>\n          ${x}\n        <\u002Fdiv>`;\n      }\n      if (t === 'fade') {\n        return `<div class=\"v-obv fade\">\n          <div class=\"vb-bg\"><svg viewBox=\"0 0 600 80\" preserveAspectRatio=\"xMidYMid slice\">\n            ${Array.from({length: 8}).map((_,i) => `<rect x=\"${30+i*70}\" y=\"${10+Math.random()*60}\" width=\"${20+Math.random()*40}\" height=\"${2+Math.random()*4}\" fill=\"#FF4500\" opacity=\"${0.08+Math.random()*0.1}\"/>`).join('')}\n          <\u002Fsvg><\u002Fdiv>\n          <span class=\"vb-mark\">[ format c: // ]<\u002Fspan>\n          ${x}\n        <\u002Fdiv>`;\n      }\n      if (t === 'kael') return `<p class=\"v-kal${isFirst ? ' first-letter' : ''}\">${x}<\u002Fp>`;\n      if (t === 'kael-end') return `<p class=\"v-kal kael-end\">${x}<\u002Fp>`;\n      const cls = `v-${v} prose${isFirst ? ' first-letter' : ''}`;\n      return `<p class=\"${cls}\">${x}<\u002Fp>`;\n    }\n\n    function renderResonanceScene(koh, tier, secId, idx) {\n      const label = ['HOMÖOSTASE', 'LATENZ', 'ALERT', 'KERNEL PANIC', 'SAFE MODE'][tier] || 'STATE';\n      const color = tier >= 3 ? '#FF4500' : tier >= 2 ? '#FFD700' : tier >= 1 ? '#4a7fb5' : '#3B3355';\n      return `<div class=\"resonance-scene\" data-tier=\"${tier}\" data-koh=\"${koh}\" data-color=\"${color}\">\n        <canvas class=\"resonance-canvas\" style=\"width:100%;height:100%;display:block;\"><\u002Fcanvas>\n        <div class=\"scene-label\">TIER ${tier} · ${label} · → § ${idx}<\u002Fdiv>\n        <div class=\"scene-koh\">KOH ${koh}<\u002Fdiv>\n      <\u002Fdiv>`;\n    }\n    function glitchClass(koh) {\n      const k = parseFloat(koh);\n      if (isNaN(k)) return '';\n      if (k < 0.22) return 'g4';\n      if (k < 0.30) return 'g3';\n      if (k < 0.50) return 'g2';\n      if (k < 0.80) return 'g1';\n      return '';\n    }\n\n    function datamoshBlocks(tier) {\n      if (tier < 2) return '';\n      const types = ['mh','mv','mj','mb'];\n      const count = tier >= 3 ? 10 : 4;\n      let html = '';\n      for (let i = 0; i < count; i++) {\n        const top  = 5 + Math.random() * 88;\n        const left = Math.random() * 75;\n        // horizontal mosh: wide & thin; vertical: narrow & taller; jitter: small square\n        const type = types[Math.floor(Math.random() * types.length)];\n        let w, h;\n        if (type === 'mh') { w = 120 + Math.random() * 320; h = 3 + Math.random() * 8; }\n        else if (type === 'mv') { w = 20 + Math.random() * 60; h = 30 + Math.random() * 80; }\n        else if (type === 'mj') { w = 10 + Math.random() * 40; h = 2 + Math.random() * 10; }\n        else { w = 80 + Math.random() * 200; h = 8 + Math.random() * 24; }\n        const delay = Math.random() * 3;\n        html += `<div class=\"datamosh ${type}\" style=\"top:${top}%;left:${left}%;width:${w}px;height:${h}px;animation-delay:${delay}s;\"><\u002Fdiv>`;\n      }\n      return html;\n    }\n\n    function climaxOverlay(tier) {\n      // Only for the strongest tier (3) — kollaps + trennung\n      if (tier < 3) return '';\n      let bars = '<div class=\"climax-bars\">';\n      for (let i = 0; i < 6; i++) {\n        const top = Math.random() * 95;\n        const height = 4 + Math.random() * 22;\n        const delay = Math.random() * 1.2;\n        bars += `<div class=\"cb-row\" style=\"top:${top}%;height:${height}px;animation-delay:${delay}s;\"><\u002Fdiv>`;\n      }\n      bars += '<\u002Fdiv>';\n      // Macro-block grid\n      for (let i = 0; i < 8; i++) {\n        const top = Math.random() * 90;\n        const left = -5 + Math.random() * 105;\n        const w = 60 + Math.random() * 180;\n        const h = 4 + Math.random() * 18;\n        const delay = Math.random();\n        bars += `<div class=\"macroblock\" style=\"top:${top}%;left:${left}%;width:${w}px;height:${h}px;animation-delay:${delay}s;\"><\u002Fdiv>`;\n      }\n      return bars;\n    }\n\n    let html = '';\n    let marginsRightHtml = '';\n    data.sections.forEach((sec, i) => {\n      const num = String(i + 1).padStart(2, '0');\n      const meta = SECTION_META[sec.id] || { tier: 0, koh: '0.998', annot: [] };\n      const gcls = glitchClass(meta.koh);\n      html += `<section class=\"section ${gcls}\" id=\"sec-${sec.id}\" data-tier=\"${meta.tier}\" data-koh=\"${meta.koh}\">`;\n      html += `<div class=\"section-marker\">\n        <span class=\"num\">§ ${num}<\u002Fspan>\n        <h2>${sec.h}<\u002Fh2>\n        <span class=\"tier tier-${meta.tier}\"><span class=\"dot\"><\u002Fspan>TIER ${meta.tier} · KOH ${meta.koh}<\u002Fspan>\n      <\u002Fdiv>`;\n      // Datamosh blocks scattered within high-tier sections\n      html += datamoshBlocks(meta.
